<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard RHM - Phúc VIP</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #f59e0b; --bg-theme: radial-gradient(circle at center, #291000 0%, #000 100%); }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg-theme); color: #fff; margin: 0; overflow: hidden; display: flex; flex-direction: column; align-items: center; height: 100vh; }
        
        .header { position: fixed; top: 0; width: 100%; padding: 15px 20px; background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); display: flex; justify-content: space-between; box-sizing: border-box; z-index: 100;}
        .btn-tool { background: rgba(255,255,255,0.1); color: var(--primary); border: 1px solid var(--primary); padding: 8px 15px; border-radius: 50px; font-weight: 800; text-decoration: none; cursor: pointer; font-size: 13px;}
        
        .card-container { perspective: 1000px; width: 90%; max-width: 500px; height: 60vh; margin-top: 80px; position: relative; }
        .flashcard { width: 100%; height: 100%; transition: transform 0.6s; transform-style: preserve-3d; cursor: pointer; position: absolute; }
        .flashcard.flipped { transform: rotateY(180deg); }
        
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 30px; box-sizing: border-box; border-radius: 30px; border: 2px solid var(--primary); text-align: center; background: rgba(15, 23, 42, 0.9); box-shadow: 0 15px 35px rgba(0,0,0,0.5);}
        .card-back { transform: rotateY(180deg); background: rgba(245, 158, 11, 0.1); border-color: #10b981; }
        
        .q-text { font-size: 22px; font-weight: 800; line-height: 1.5; }
        .a-text { font-size: 24px; font-weight: 900; color: #10b981; line-height: 1.5; }
        .hint { position: absolute; bottom: 20px; font-size: 12px; color: gray; }
        
        .controls { display: flex; gap: 20px; margin-top: 30px; }
        .nav-btn { background: var(--primary); color: #000; border: none; width: 60px; height: 60px; border-radius: 50%; font-size: 24px; font-weight: bold; cursor: pointer; box-shadow: 0 5px 15px rgba(245,158,11,0.4); transition: 0.2s;}
        .nav-btn:hover { transform: scale(1.1); }
        .sc-img { max-width: 100%; max-height: 200px; border-radius: 10px; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="header">
    <a href="index.html" class="btn-tool">⬅ VỀ SẢNH</a>
    <span id="card-counter" style="font-weight:900; color:var(--primary);">1 / ?</span>
</div>

<div class="card-container" id="card-container">
    <div class="flashcard" id="flashcard" onclick="flipCard()">
        <div class="card-face card-front">
            <div class="q-text" id="q-front">Đang tải...</div>
            <div class="hint">👆 Chạm để lật xem đáp án</div>
        </div>
        <div class="card-face card-back">
            <div style="font-size: 14px; color: #10b981; margin-bottom:10px; font-weight: bold;">ĐÁP ÁN CHUẨN:</div>
            <div class="a-text" id="a-back">...</div>
        </div>
    </div>
</div>

<div class="controls">
    <button class="nav-btn" onclick="move(-1)">❮</button>
    <button class="nav-btn" onclick="move(1)">❯</button>
</div>

<script>
    let flashcards = []; let curr = 0;
    function parseSC(txt) { return txt.replace(/\[IMG\](.*?)\[\/IMG\]/gi, '<img src="$1" class="sc-img">').replace(/\[B\](.*?)\[\/B\]/gi, '<b>$1</b>').replace(/\[RED\](.*?)\[\/RED\]/gi, '<span style="color:#ff4d4d">$1</span>').replace(/\[BR\]/gi, '<br>'); }

    window.onload = function() {
        const id = new URLSearchParams(window.location.search).get('id');
        const rawData = localStorage.getItem(id);
        if(!rawData) { document.getElementById('q-front').innerText = "Lỗi kết nối!"; return; }

        let q = null;
        rawData.split(/\\n|\n/).forEach(line => {
            line = line.trim(); if(!line) return;
            if(line.match(/^Câu\s*\d+:/i)) {
                if(q) flashcards.push(q);
                q = { title: parseSC(line.replace(/^Câu\s*\d+:/i, '').trim()), ans: "" };
            } else if(line.startsWith('*')) {
                if(q) q.ans = parseSC(line.substring(1).trim());
            } else if(q && !line.startsWith('•') && q.ans === "") {
                q.title += "<br>" + parseSC(line);
            }
        });
        if(q) flashcards.push(q);
        showCard(0);
    };

    function showCard(i) {
        if(flashcards.length === 0) return;
        document.getElementById('flashcard').classList.remove('flipped');
        setTimeout(() => {
            document.getElementById('q-front').innerHTML = flashcards[i].title;
            document.getElementById('a-back').innerHTML = flashcards[i].ans || "Chưa có đáp án đúng (*)";
            document.getElementById('card-counter').innerText = `${i+1} / ${flashcards.length}`;
            curr = i;
        }, 150);
    }

    function flipCard() { document.getElementById('flashcard').classList.toggle('flipped'); }
    function move(d) { let n = curr + d; if(n >= 0 && n < flashcards.length) showCard(n); }
</script>
</body>
</html>
