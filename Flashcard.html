<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard RHM - Phúc VIP</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        [data-theme="dark"] {
            --primary: #f59e0b;
            --bg-theme: radial-gradient(circle at center, #291000 0%, #020617 100%);
            --card-bg: rgba(15, 23, 42, 0.92);
            --header-bg: rgba(0, 0, 0, 0.65);
            --text: #ffffff;
            --hint-bg: rgba(245, 158, 11, 0.12);
            --border: #f59e0b;
            --exp-bg: rgba(0, 0, 0, 0.45);
        }
        
        [data-theme="light"] {
            --primary: #d97706;
            --bg-theme: radial-gradient(circle at center, #fef3c7 0%, #fde68a 100%);
            --card-bg: rgba(255, 255, 255, 0.96);
            --header-bg: rgba(255, 255, 255, 0.85);
            --text: #0f172a;
            --hint-bg: rgba(217, 119, 6, 0.12);
            --border: #d97706;
            --exp-bg: rgba(254, 243, 199, 0.65);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-theme);
            color: var(--text);
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            transition: background 0.5s ease-in-out, color 0.3s;
        }

        .header {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 12px 20px;
            background: var(--header-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            border-bottom: 1px solid rgba(245, 158, 11, 0.25);
            transition: background 0.3s;
        }

        .header-actions { display: flex; align-items: center; gap: 10px; }

        .btn-tool {
            background: rgba(128, 128, 128, 0.12);
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 8px 16px;
            border-radius: 50px;
            font-weight: 800;
            text-decoration: none;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
            font-family: inherit;
        }
        .btn-tool:hover { background: var(--primary); color: #fff; }

        .card-container {
            perspective: 1200px;
            width: 88%;
            max-width: 480px;
            height: 62vh;
            position: relative;
            z-index: 10;
            margin-top: 10px;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
            cursor: pointer;
            position: absolute;
        }

        .flashcard.flipped { transform: rotateY(180deg); }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px 25px 55px 25px;
            border-radius: 28px;
            border: 2px solid var(--border);
            text-align: center;
            background: var(--card-bg);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
            overflow-y: auto;
            transition: background 0.3s, border-color 0.3s;
        }

        .card-back {
            transform: rotateY(180deg);
            border-color: #10b981;
        }

        .q-text { font-size: 19px; font-weight: 800; line-height: 1.55; color: var(--text); width: 100%; }
        .a-text { font-size: 19px; font-weight: 900; color: #10b981; line-height: 1.55; width: 100%; }

        .hint {
            position: absolute;
            bottom: 16px;
            font-size: 11.5px;
            font-weight: 700;
            color: var(--primary);
            background: var(--hint-bg);
            padding: 6px 16px;
            border-radius: 20px;
        }

        .sc-img { max-width: 100%; max-height: 190px; border-radius: 12px; margin: 12px auto; border: 1px solid var(--primary); display: block; }

        .nav-arrow {
            position: fixed;
            top: 50%;
            background: var(--header-bg);
            backdrop-filter: blur(10px);
            border: 2px solid var(--primary);
            color: var(--primary);
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: 900;
            z-index: 1000;
            transform: translateY(-50%);
            transition: 0.2s;
            font-size: 18px;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.2);
            user-select: none;
        }
        .nav-arrow:hover {
            background: var(--primary);
            color: #fff;
            transform: translateY(-50%) scale(1.1);
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.6);
        }
        #nav-prev { left: 12px; }
        #nav-next { right: 12px; }

        .progress-bar-bg { position: fixed; bottom: 0; left: 0; width: 100%; height: 6px; background: rgba(128,128,128,0.2); z-index: 900; }
        .progress-bar { height: 100%; width: 0%; background: var(--primary); transition: width 0.3s ease; }

        .donate-badge {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--header-bg);
            backdrop-filter: blur(10px);
            border: 1.5px dashed var(--primary);
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            z-index: 1000;
            transition: 0.3s;
            white-space: nowrap;
            color: var(--text);
        }
        .donate-badge:hover { transform: translateX(-50%) scale(1.05); }

        #toast { position: fixed; top: 75px; left: 50%; transform: translateX(-50%) scale(0.8); background: var(--card-bg); color: var(--text); border: 2px solid var(--primary); padding: 10px 22px; border-radius: 50px; font-weight: 800; font-size: 13px; z-index: 2000; opacity: 0; pointer-events: none; transition: 0.25s; }
        #toast.show { transform: translateX(-50%) scale(1); opacity: 1; }
    </style>
</head>
<body>

<div id="toast">✅ Đã sao chép!</div>

<div class="header">
    <a href="index.html" class="btn-tool">⬅ SẢNH</a>
    <span id="card-counter" style="font-weight:900; color:var(--primary); font-size: 15px;">1 / ?</span>
    <div class="header-actions">
        <button onclick="shuffleCards()" class="btn-tool" title="Đảo ngẫu nhiên thẻ">🔀 ĐẢO</button>
        <button onclick="toggleMode()" class="btn-tool" style="padding: 6px 12px; font-size: 16px;">🌓</button>
    </div>
</div>

<div id="nav-prev" class="nav-arrow" onclick="move(-1)" style="display:none;">❮</div>
<div id="nav-next" class="nav-arrow" onclick="move(1)" style="display:none;">❯</div>

<div class="card-container" onclick="flipCard()">
    <div class="flashcard" id="flashcard">
        <div class="card-face card-front">
            <div class="q-text" id="q-text">Đang tải thẻ...</div>
            <div class="hint">👆 Chạm hoặc nhấn Phím Cách (Space) để lật</div>
        </div>
        <div class="card-face card-back">
            <div class="a-text" id="a-text">Đáp án</div>
            <div class="hint" style="color:#10b981;">👆 Chạm để quay lại câu hỏi</div>
        </div>
    </div>
</div>

<div class="donate-badge" onclick="copySTK()">💖 Donate: Đỗ Hồng Phúc - <b style="color:var(--primary);">BIDV 8812766209</b></div>
<div class="progress-bar-bg"><div class="progress-bar" id="progress-bar"></div></div>

<script>
    let flashcards = [];
    let currentIdx = 0;

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2200);
    }

    function parseSC(txt) {
        return txt.replace(/\[IMG\](.*?)\[\/IMG\]/gi, '<img src="$1" class="sc-img">')
                  .replace(/\[B\](.*?)\[\/B\]/gi, '<b>$1</b>')
                  .replace(/\[RED\](.*?)\[\/RED\]/gi, '<span style="color:#ef4444;font-weight:800;">$1</span>')
                  .replace(/\[BLUE\](.*?)\[\/BLUE\]/gi, '<span style="color:#3b82f6;font-weight:800;">$1</span>')
                  .replace(/\[BR\]/gi, '<br>');
    }

    function copySTK() {
        navigator.clipboard.writeText('8812766209');
        showToast("💖 Đã copy STK 8812766209 - Đỗ Hồng Phúc!");
    }

    function toggleMode() {
        const h = document.documentElement;
        const nextTheme = h.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        h.setAttribute('data-theme', nextTheme);
        localStorage.setItem('theme_pref', nextTheme);
    }

    function flipCard() {
        document.getElementById('flashcard').classList.toggle('flipped');
    }

    function showCard(idx) {
        if (!flashcards.length) return;
        const cardEl = document.getElementById('flashcard');
        cardEl.classList.remove('flipped');

        setTimeout(() => {
            document.getElementById('q-text').innerHTML = flashcards[idx].title;
            document.getElementById('a-text').innerHTML = flashcards[idx].ans;
            document.getElementById('card-counter').innerText = `${idx + 1} / ${flashcards.length}`;
            document.getElementById('progress-bar').style.width = `${((idx + 1) / flashcards.length) * 100}%`;

            document.getElementById('nav-prev').style.display = idx > 0 ? 'flex' : 'none';
            document.getElementById('nav-next').style.display = idx < flashcards.length - 1 ? 'flex' : 'none';
        }, 120);
    }

    function move(dir) {
        let next = currentIdx + dir;
        if (next >= 0 && next < flashcards.length) {
            currentIdx = next;
            showCard(currentIdx);
        }
    }

    function shuffleCards() {
        if (flashcards.length < 2) return;
        for (let i = flashcards.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [flashcards[i], flashcards[j]] = [flashcards[j], flashcards[i]];
        }
        currentIdx = 0;
        showCard(0);
        showToast("🔀 Đã trộn ngẫu nhiên bộ thẻ!");
    }

    // Hỗ trợ phím tắt bàn phím
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'Enter') {
            e.preventDefault();
            flipCard();
        } else if (e.code === 'ArrowRight') {
            move(1);
        } else if (e.code === 'ArrowLeft') {
            move(-1);
        }
    });

    window.onload = function() {
        const savedTheme = localStorage.getItem('theme_pref') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);

        const id = new URLSearchParams(window.location.search).get('id');
        const rawData = localStorage.getItem(id);
        if (!rawData) {
            document.getElementById('q-text').innerHTML = "❌ Không tìm thấy dữ liệu. Vui lòng quay lại Sảnh!";
            return;
        }

        let q = null;
        rawData.split(/\\n|\n/).forEach(line => {
            line = line.trim();
            if (!line) return;
            if (line.match(/^Câu\s*\d+:/i)) {
                if (q) flashcards.push(q);
                let cleanedTitle = line.replace(/\[?(Chọn )?\d+ đáp án\]?/gi, '').replace(/\(?(Chọn )?\d+ đáp án\)?/gi, '').trim();
                q = { title: parseSC(cleanedTitle), opts: [], explanation: "" };
            } else if (q) {
                if (line.startsWith('*')) {
                    q.opts.push({ text: parseSC(line.substring(1).trim()), isC: true });
                } else if (line.startsWith('•')) {
                    q.opts.push({ text: parseSC(line.substring(1).trim()), isC: false });
                } else {
                    let cleanedLine = line.replace(/\[?(Chọn )?\d+ đáp án\]?/gi, '').replace(/\(?(Chọn )?\d+ đáp án\)?/gi, '').trim();
                    if (q.opts.length === 0) {
                        q.title += "<br>" + parseSC(cleanedLine);
                    } else {
                        q.explanation += (q.explanation ? "<br>" : "") + parseSC(cleanedLine);
                    }
                }
            }
        });
        if (q) flashcards.push(q);

        flashcards.forEach(fc => {
            let correctOpts = fc.opts.filter(o => o.isC).map(o => o.text);
            let correctText = correctOpts.length ? correctOpts.join('<br><br>') : "Chưa cập nhật đáp án";
            fc.ans = `✅ ${correctText}`;
            // ĐÃ SỬA: Chỉ render duy nhất 1 khối Giải thích với biến màu chuẩn
            if (fc.explanation) {
                fc.ans += `<div style="margin-top:18px; font-size:13.5px; font-weight:500; color:var(--text); background:var(--exp-bg); padding:12px 15px; border-radius:14px; border:1px dashed var(--primary); text-align:left; line-height:1.6;"><b>💡 Giải thích:</b><br>${fc.explanation}</div>`;
            }
        });

        if (flashcards.length > 0) {
            showCard(0);
        } else {
            document.getElementById('q-text').innerText = "Bộ thẻ trống!";
        }
    };
</script>
</body>
</html>
