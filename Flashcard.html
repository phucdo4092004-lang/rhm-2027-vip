<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard RHM - Phúc VIP</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #f59e0b; --bg-theme: radial-gradient(circle at center, #291000 0%, #000 100%); }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg-theme); color: #fff; margin: 0; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        
        .header { position: fixed; top: 0; width: 100%; padding: 15px 20px; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); display: flex; justify-content: space-between; box-sizing: border-box; z-index: 100; border-bottom: 1px solid rgba(245,158,11,0.2);}
        .btn-tool { background: rgba(255,255,255,0.1); color: var(--primary); border: 1px solid var(--primary); padding: 8px 15px; border-radius: 50px; font-weight: 800; text-decoration: none; cursor: pointer; font-size: 13px;}
        
        .card-container { perspective: 1000px; width: 85%; max-width: 450px; height: 60vh; position: relative; z-index: 10; margin-top: 20px;}
        .flashcard { width: 100%; height: 100%; transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); transform-style: preserve-3d; cursor: pointer; position: absolute; }
        .flashcard.flipped { transform: rotateY(180deg); }
        
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 30px; box-sizing: border-box; border-radius: 30px; border: 2px solid var(--primary); text-align: center; background: rgba(15, 23, 42, 0.9); box-shadow: 0 15px 35px rgba(0,0,0,0.5); overflow-y: auto;}
        .card-back { transform: rotateY(180deg); background: rgba(245, 158, 11, 0.1); border-color: #10b981; }
        
        .q-text { font-size: 20px; font-weight: 800; line-height: 1.5; }
        .a-text { font-size: 20px; font-weight: 900; color: #10b981; line-height: 1.5; }
        .hint { position: absolute; bottom: 20px; font-size: 12px; color: rgba(255,255,255,0.5); background: rgba(0,0,0,0.5); padding: 5px 15px; border-radius: 20px;}
        
        .sc-img { max-width: 100%; max-height: 180px; border-radius: 10px; margin-bottom: 15px; border: 1px solid var(--primary); }

        .nav-arrow { position: fixed; top: 50%; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); border: 2px solid var(--primary); color: var(--primary); width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: 900; z-index: 1000; transform: translateY(-50%); transition: 0.2s; font-size: 20px; box-shadow: 0 0 15px rgba(245,158,11,0.2);}
        .nav-arrow:hover { background: var(--primary); color: #000; transform: translateY(-50%) scale(1.1); box-shadow: 0 0 20px rgba(245,158,11,0.6);}
        #nav-prev { left: 10px; }
        #nav-next { right: 10px; }

        .donate-badge { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); border: 2px dashed var(--primary); padding: 10px 20px; border-radius: 50px; font-size: 12px; font-weight: 800; cursor: pointer; z-index: 1000; box-shadow: 0 0 15px rgba(245,158,11,0.2); transition: 0.3s; white-space: nowrap;}
        .donate-badge:hover { transform: translateX(-50%) scale(1.05); box-shadow: 0 10px 25px rgba(245,158,11,0.5); }
    </style>
</head>
<body>

<div class="header">
    <a href="index.html" class="btn-tool">⬅ VỀ SẢNH</a>
    <span id="card-counter" style="font-weight:900; color:var(--primary); font-size: 15px;">1 / ?</span>
</div>

<div id="nav-prev" class="nav-arrow" onclick="move(-1)" style="display:none;">❮</div>
<div id="nav-next" class="nav-arrow" onclick="move(1)">❯</div>

<div class="card-container" id="card-container">
    <div class="flashcard" id="flashcard" onclick="flipCard()">
        <div class="card-face card-front">
            <div class="q-text" id="q-front">Đang tải...</div>
            <div class="hint" id="hint-text">👆 Chạm để lật xem đáp án</div>
        </div>
        <div class="card-face card-back">
            <div style="font-size: 13px; color: #10b981; margin-bottom:10px; font-weight: 800; border-bottom: 1px dashed #10b981; padding-bottom: 5px;">ĐÁP ÁN CHUẨN:</div>
            <div class="a-text" id="a-back">...</div>
        </div>
    </div>
</div>

<div class="donate-badge" onclick="copySTK()">💖 Donate cho phúc đi Đỗ Hồng Phúc <b style="color:var(--primary);">BIDV 8812766209</b></div>

<script>
    let flashcards = []; let curr = 0;
    function parseSC(txt) { return txt.replace(/\[IMG\](.*?)\[\/IMG\]/gi, '<img src="$1" class="sc-img">').replace(/\[B\](.*?)\[\/B\]/gi, '<b>$1</b>').replace(/\[RED\](.*?)\[\/RED\]/gi, '<span style="color:#ff4d4d">$1</span>').replace(/\[BR\]/gi, '<br>'); }
    function copySTK() { navigator.clipboard.writeText('8812766209'); alert("Đã copy STK Đỗ Hồng Phúc!"); }

    // ĐỌC FULL THÔNG TIN
    window.onload = function() {
        const id = new URLSearchParams(window.location.search).get('id');
        const rawData = localStorage.getItem(id);
        if(!rawData) { document.getElementById('q-front').innerText = "Lỗi kết nối!"; return; }

        let q = null;
        rawData.split(/\\n|\n/).forEach(line => {
            line = line.trim(); if(!line) return;
            if(line.match(/^Câu\s*\d+:/i)) {
                if(q) flashcards.push(q);
                let cleanedTitle = line.replace(/^Câu\s*\d+:/i, '').replace(/\[?(Chọn )?\d+ đáp án\]?/gi, '').replace(/\(?(Chọn )?\d+ đáp án\)?/gi, '').trim();
                q = { title: parseSC(cleanedTitle), opts: [], explanation: "" };
            } else if (q) {
                if(line.startsWith('*')) {
                    q.opts.push({ text: parseSC(line.substring(1).trim()), isC: true });
                } else if(line.startsWith('•')) {
                    q.opts.push({ text: parseSC(line.substring(1).trim()), isC: false });
                } else {
                    let cleanedLine = line.replace(/\[?(Chọn )?\d+ đáp án\]?/gi, '').replace(/\(?(Chọn )?\d+ đáp án\)?/gi, '').trim();
                    if(q.opts.length === 0) {
                        q.title += "<br>" + parseSC(cleanedLine);
                    } else {
                        q.explanation += (q.explanation ? "<br>" : "") + parseSC(cleanedLine);
                    }
                }
            }
        });
        if(q) flashcards.push(q);

        // GỘP ĐÁP ÁN ĐÚNG + LỜI GIẢI THÍCH VÀO MẶT SAU CỦA THẺ
        flashcards.forEach(fc => {
            let correctText = fc.opts.filter(o => o.isC).map(o => o.text).join('<br><br>');
            if(!correctText) correctText = "Chưa có đáp án đúng (*)";
            
            fc.ans = correctText;
            if (fc.explanation) {
                fc.ans += `<br><br><div style="font-size:13px; font-weight:normal; color:#f8fafc; background:rgba(0,0,0,0.5); padding:10px; border-radius:10px; border:1px dashed var(--primary); text-align:left;"><b>💡 Giải thích:</b><br>${fc.explanation}</div>`;
            }
        });

        showCard(0);
    };

    function showCard(i) {
        if(flashcards.length === 0) return;
        document.getElementById('flashcard').classList.remove('flipped');
        
        setTimeout(() => {
            document.getElementById('q-front').innerHTML = flashcards[i].title;
            document.getElementById('a-back').innerHTML = flashcards[i].ans;
            document.getElementById('card-counter').innerText = `${i+1} / ${flashcards.length}`;
            curr = i;

            document.getElementById('nav-prev').style.display = i > 0 ? 'flex' : 'none';
            document.getElementById('nav-next').style.display = i < flashcards.length - 1 ? 'flex' : 'none';
        }, 150); 
    }

    // ĐÃ HỦY BO TỰ ĐỘNG CHUYỂN CÂU. LẬT RA ĐỂ ĐÓ ĐẾN KHI NÀO SẾP TỰ BẤM NEXT THÌ THÔI
    function flipCard() { 
        document.getElementById('flashcard').classList.toggle('flipped'); 
    }

    function move(d) { 
        let n = curr + d; 
        if(n >= 0 && n < flashcards.length) showCard(n); 
    }
</script>
</body>
</html>
