<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư Viện VIP - Phúc RHM</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #007bff; --primary-grad: linear-gradient(90deg, #007bff, #00c6ff); --accent: #ff00de; }
        [data-theme="dark"] { --bg: #020617; --card: rgba(15, 23, 42, 0.85); --text: #f8fafc; --glass: rgba(255,255,255,0.1); --border: rgba(255,255,255,0.15); }
        [data-theme="light"] { --bg: #f8f9fa; --card: rgba(255, 255, 255, 0.95); --text: #1e293b; --glass: rgba(0,0,0,0.05); --border: rgba(0,0,0,0.1); }
        
        body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; line-height: 1.8; transition: 0.3s; }
        
        .header { position: sticky; top: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 100; border-bottom: 1px solid var(--border);}
        
        .btn-tool { background: var(--glass); color: var(--text); border: 1px solid var(--border); padding: 10px 15px; border-radius: 12px; cursor: pointer; font-weight: 800; font-size: 13px; transition: all 0.3s ease; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; box-sizing: border-box;}
        .btn-tool:hover { background: var(--primary-grad); color: #fff; border-color: transparent;}
        .btn-exit { width: auto; padding: 8px 15px; border-radius: 50px; background: var(--primary-grad); color: #fff; border: none; }
        .btn-menu { width: auto; padding: 8px 15px; border-radius: 50px; border: 1px solid var(--primary); color: var(--primary); }
        .btn-speak { background: linear-gradient(45deg, #ff00de, #ff8a00); color: #fff; border: none;}

        .btn-top { position: fixed; bottom: 80px; right: 20px; background: var(--primary); color: #fff; width: 45px; height: 45px; border-radius: 50%; font-size: 20px; font-weight: bold; border: none; cursor: pointer; display: none; box-shadow: 0 5px 15px rgba(0,0,0,0.4); z-index: 1000; transition: 0.3s; align-items: center; justify-content: center;}
        .btn-top:hover { transform: translateY(-5px); }

        .drawer { position: fixed; top: 0; right: -320px; width: 280px; height: 100vh; background: var(--card); border-left: 2px solid var(--primary); z-index: 9999; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); padding: 25px; box-sizing: border-box; overflow-y: auto; box-shadow: -10px 0 30px rgba(0,0,0,0.5);}
        .drawer.open { right: 0; }
        .drawer-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); z-index: 9998; display: none; backdrop-filter: blur(5px);}
        .drawer-overlay.show { display: block; }
        .setting-group { margin-bottom: 20px; display: flex; flex-direction: column; gap: 10px; }

        .speed-control { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 14px; font-weight: 900; color: var(--primary); background: var(--glass); padding: 10px; border-radius: 12px; border: 1px solid var(--border); width: 100%; box-sizing: border-box;}
        input[type="range"] { width: 60%; cursor: pointer; }

        .container { max-width: 850px; margin: 30px auto; padding: 25px; background: var(--card); backdrop-filter: blur(20px); border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); border: 1px solid var(--border); }
        #content { font-size: 18px; text-align: justify; font-weight: 500; letter-spacing: 0.3px; }
        
        .sc-img { display: block; max-width: 100%; border-radius: 12px; margin: 20px auto; border: 2px solid var(--primary); }
        .sc-red { color: #ff4d4d; font-weight: 800; background: rgba(255,77,77,0.1); padding: 2px 8px; border-radius: 8px;}
        .sc-blue { color: #00c6ff; font-weight: 800; background: rgba(0,198,255,0.1); padding: 2px 8px; border-radius: 8px;}

        /* ĐÃ CẬP NHẬT CHỮ DONATE */
        .donate-badge { position: fixed; bottom: 20px; right: 20px; background: var(--glass); backdrop-filter: blur(10px); border: 2px dashed #ff00de; padding: 10px 20px; border-radius: 50px; font-size: 13px; font-weight: 800; cursor: pointer; z-index: 1000; box-shadow: 0 0 15px rgba(255,0,222,0.2); transition: 0.3s;}
        .donate-badge:hover { transform: translateY(-5px) scale(1.05); box-shadow: 0 10px 25px rgba(255,0,222,0.5); }
    </style>
</head>
<body>
    <div class="header">
        <a href="index.html" class="btn-tool btn-exit">⬅ VỀ SẢNH</a>
        <button class="btn-tool btn-menu" onclick="toggleMenu()">⚙️ TÙY CHỈNH</button>
    </div>
    
    <div id="drawer-overlay" class="drawer-overlay" onclick="toggleMenu()"></div>

    <div id="settings-drawer" class="drawer">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 25px;">
            <h3 style="margin:0; color:var(--primary); font-weight:900;">⚙️ CÔNG CỤ ĐỌC</h3>
            <button onclick="toggleMenu()" style="background:none; border:none; color:var(--text); font-size:24px; cursor:pointer;">&times;</button>
        </div>

        <div class="setting-group" style="flex-direction: row; gap: 10px;">
            <button class="btn-tool" onclick="adjSize(2)">A+ To</button>
            <button class="btn-tool" onclick="adjSize(-2)">A- Nhỏ</button>
        </div>

        <div class="setting-group">
            <div style="font-size:12px; font-weight:bold; color:var(--text);">Chọn ngôn ngữ đọc:</div>
            <select id="voice-select" class="btn-tool" style="outline: none; text-align:left;"></select>
        </div>

        <div class="setting-group">
            <div style="font-size:12px; font-weight:bold; color:var(--text);">Tốc độ đọc:</div>
            <div class="speed-control">
                🐢 <input type="range" id="speed" min="0.5" max="2" step="0.1" value="1"> 🚀
            </div>
        </div>

        <div class="setting-group">
            <button class="btn-tool btn-speak" id="btn-read-action" onclick="speak()">🔊 BẮT ĐẦU ĐỌC</button>
        </div>

        <div class="setting-group">
            <button class="btn-tool" onclick="toggleMode()">🌓 SÁNG / TỐI</button>
        </div>
    </div>
    
    <div class="container">
        <h1 id="title" style="color:var(--primary); border-bottom: 2px dashed var(--accent); padding-bottom: 15px; font-weight: 900; font-size: 24px; text-align: center;">ĐANG TẢI...</h1>
        <div id="content" style="text-align: center; color: gray; margin-top: 30px; font-weight: 700;">Đang kết nối CSDL...</div>
    </div>

    <button class="btn-top" id="btnTop" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">↑</button>

    <div class="donate-badge" onclick="copySTK()">💖 Donate cho phúc đi Đỗ Hồng Phúc <b style="color:var(--accent);">BIDV 8812766209</b></div>

<script>
    let fSize = 18; let synth = window.speechSynthesis; let allVoices = [];

    window.onscroll = function() { document.getElementById('btnTop').style.display = document.documentElement.scrollTop > 300 ? "flex" : "none"; };
    function toggleMenu() { document.getElementById('settings-drawer').classList.toggle('open'); document.getElementById('drawer-overlay').classList.toggle('show'); }
    function parseSC(txt) { if (!txt) return ""; return txt.replace(/\[IMG\](.*?)\[\/IMG\]/gi, '<img src="$1" class="sc-img">').replace(/\[B\](.*?)\[\/B\]/gi, '<b>$1</b>').replace(/\[RED\](.*?)\[\/RED\]/gi, '<span class="sc-red">$1</span>').replace(/\[BLUE\](.*?)\[\/BLUE\]/gi, '<span class="sc-blue">$1</span>').replace(/\[BR\]/gi, '<br>').replace(/\n/g, '<br>'); }
    
    function adjSize(v) { fSize += v; document.getElementById('content').style.fontSize = fSize + 'px'; }
    function toggleMode() { const h = document.documentElement; h.setAttribute('data-theme', h.getAttribute('data-theme')==='dark'?'light':'dark'); }
    function copySTK() { navigator.clipboard.writeText('8812766209'); alert("Đã copy STK Đỗ Hồng Phúc!"); }

    function populateVoices() {
        allVoices = synth.getVoices(); if(allVoices.length === 0) return;
        allVoices.sort((a, b) => { if (a.lang.includes('vi') && !b.lang.includes('vi')) return -1; if (!a.lang.includes('vi') && b.lang.includes('vi')) return 1; return 0; });
        const sel = document.getElementById('voice-select'); let html = '';
        allVoices.forEach((v, i) => { let flag = v.lang.includes('vi') ? '🇻🇳 ' : (v.lang.includes('en') ? '🇬🇧 ' : '🌐 '); html += `<option value="${i}">${flag}${v.name.substring(0, 20)}</option>`; });
        sel.innerHTML = html;
    }
    populateVoices(); if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = populateVoices;

    function speak() {
        const btn = document.getElementById('btn-read-action');
        if (synth.speaking) { synth.cancel(); btn.innerHTML = "🔊 TIẾP TỤC ĐỌC"; return; }
        let txtToRead = document.getElementById('content').innerHTML.replace(/<[^>]*>?/gm, ''); if(!txtToRead.trim()) return;
        let utter = new SpeechSynthesisUtterance(txtToRead); 
        if(allVoices.length > 0) utter.voice = allVoices[document.getElementById('voice-select').value];
        utter.rate = document.getElementById('speed').value;
        utter.onend = function() { btn.innerHTML = "🔊 BẮT ĐẦU ĐỌC"; };
        synth.speak(utter); btn.innerHTML = "⏸ DỪNG LẠI"; toggleMenu();
    }

    window.onload = function() {
        const id = new URLSearchParams(window.location.search).get('id'); const title = new URLSearchParams(window.location.search).get('title');
        if(!id) { document.getElementById('content').innerHTML = "Lỗi: ID tài liệu."; return; }
        const rawContent = localStorage.getItem(id);
        if(rawContent) { document.getElementById('title').innerText = title || "TÀI LIỆU RHM"; document.getElementById('content').innerHTML = parseSC(rawContent);
        } else { document.getElementById('content').innerHTML = "Lỗi kết nối. Về sảnh để tải lại."; }
    };
</script>
</body>
</html>
