<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
    <script>
        (function guardStudioPage() {
            const STUDIO_PIN_HASH = 7569999564299224; // PIN: 04092004
            function computePinHash(str) {
                let h = 5381;
                for (let i = 0; i < str.length; i++) h = (h * 33) + str.charCodeAt(i);
                return h;
            }
            if (sessionStorage.getItem('rhm_studio_auth') !== 'true') {
                const entered = prompt("🔐 TRẠM BIÊN TẬP STUDIO RHM VIP\nNhập mã PIN quản trị của Đỗ Hồng Phúc:");
                if (entered && computePinHash(entered.trim()) === STUDIO_PIN_HASH) {
                    sessionStorage.setItem('rhm_studio_auth', 'true');
                } else {
                    alert("⛔ Truy cập bị từ chối! Quay về Sảnh chính...");
                    window.location.replace('index.html');
                }
            }
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Biên Tập RHM Pro - PDF Smart Clean</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f2fe; --primary-grad: linear-gradient(135deg, #00f2fe, #4facfe);
            --accent: #ff00de; --accent-grad: linear-gradient(135deg, #8b5cf6, #ff00de);
            --bg: #020617; --card: rgba(15, 23, 42, 0.92); --panel: rgba(30, 41, 59, 0.65);
            --text: #f8fafc; --muted: #94a3b8; --border: rgba(255, 255, 255, 0.12);
            --success: #10b981; --danger: #ef4444; --warning: #f59e0b; --purple: #a855f7;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #020617 85%); color: var(--text); min-height: 100vh; overflow-x: hidden; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 12px 24px; background: rgba(2, 6, 23, 0.9); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; flex-wrap: wrap; gap: 10px; }
        .logo { font-weight: 900; font-size: 17px; display: flex; align-items: center; gap: 10px; color: var(--primary); }
        .logo span { background: var(--primary-grad); color: #000; padding: 3px 10px; border-radius: 8px; font-size: 11px; font-weight: 900; }
        .header-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .btn { background: var(--panel); color: var(--text); border: 1px solid var(--border); padding: 8px 13px; border-radius: 10px; font-weight: 800; font-size: 12px; cursor: pointer; transition: 0.2s; font-family: inherit; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
        .btn:hover { border-color: var(--primary); transform: translateY(-1px); }
        .btn-primary { background: var(--primary-grad); color: #000; border: none; }
        .btn-accent { background: var(--accent-grad); color: #fff; border: none; }
        .btn-success { background: rgba(16, 185, 129, 0.15); color: var(--success); border-color: var(--success); }
        .btn-success:hover { background: var(--success); color: #000; }

        .workspace { display: grid; grid-template-columns: 1fr 1.15fr; gap: 18px; max-width: 1560px; margin: 16px auto; padding: 0 18px; }
        .panel { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 18px; backdrop-filter: blur(20px); display: flex; flex-direction: column; gap: 12px; height: calc(100vh - 82px); box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .panel-title { font-size: 14px; font-weight: 900; color: var(--primary); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }

        .meta-grid { display: grid; grid-template-columns: 0.9fr 1.3fr 1.1fr 1.3fr; gap: 8px; }
        .input-box { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 8px 11px; color: var(--text); font-family: inherit; font-size: 12.5px; font-weight: 600; outline: none; width: 100%; }
        .input-box:focus { border-color: var(--primary); }

        .toolbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; background: var(--panel); padding: 8px 10px; border-radius: 12px; border: 1px solid var(--border); }
        .chk-label { display: flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 700; color: var(--muted); cursor: pointer; user-select: none; margin-right: 4px; }
        .chk-label input { accent-color: var(--primary); width: 14px; height: 14px; }
        .sc-btn { background: rgba(255,255,255,0.06); border: 1px solid var(--border); color: var(--text); padding: 4px 9px; border-radius: 6px; font-size: 11px; font-weight: 800; cursor: pointer; font-family: inherit; }
        .sc-btn:hover { border-color: var(--primary); color: var(--primary); }

        textarea.raw-area { flex: 1; width: 100%; background: rgba(2, 6, 23, 0.75); border: 1px solid var(--border); border-radius: 14px; padding: 14px; color: var(--text); font-family: 'Consolas', monospace; font-size: 13px; line-height: 1.6; resize: none; outline: none; }
        textarea.raw-area:focus { border-color: var(--primary); }

        .filter-bar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
        .f-pill { padding: 5px 11px; border-radius: 50px; font-size: 11.5px; font-weight: 800; cursor: pointer; background: var(--panel); border: 1px solid var(--border); color: var(--muted); transition: 0.2s; }
        .f-pill.active { background: var(--primary); color: #000; border-color: transparent; }

        .preview-area { flex: 1; overflow-y: auto; padding-right: 6px; display: flex; flex-direction: column; gap: 12px; }
        .q-card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 14px; transition: 0.2s; }
        .q-card.err-ans { border-color: var(--danger); background: rgba(239, 68, 68, 0.06); }
        .q-card.warn-exp { border-left: 4px solid var(--warning); }
        .q-card.warn-dup { border-color: var(--purple); background: rgba(168, 85, 247, 0.07); }

        .q-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 11.5px; font-weight: 800; flex-wrap: wrap; gap: 6px; }
        .badge { padding: 2px 8px; border-radius: 6px; font-size: 10.5px; font-weight: 900; }
        .b-multi { background: rgba(0, 242, 254, 0.15); color: var(--primary); border: 1px solid var(--primary); }
        .b-dup { background: rgba(168, 85, 247, 0.2); color: #d8b4fe; border: 1px solid var(--purple); }
        .b-err { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }
        .b-warn { background: rgba(245, 158, 11, 0.2); color: #fde68a; }

        .q-title-edit { width: 100%; background: rgba(2, 6, 23, 0.6); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; color: var(--text); font-family: inherit; font-weight: 800; font-size: 13.5px; margin-bottom: 8px; outline: none; }
        .q-title-edit:focus { border-color: var(--primary); }
        .img-preview-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
        .img-thumb { max-height: 90px; border-radius: 8px; border: 1px solid var(--primary); }

        .q-opt { padding: 6px 10px; border-radius: 8px; background: rgba(2, 6, 23, 0.55); border: 1px solid var(--border); margin-bottom: 5px; display: flex; align-items: center; gap: 8px; }
        .q-opt.is-correct { background: rgba(16, 185, 129, 0.16); border-color: var(--success); color: var(--success); }
        .q-opt input[type="checkbox"] { accent-color: var(--success); width: 16px; height: 16px; cursor: pointer; }
        .q-opt input[type="text"] { flex: 1; background: transparent; border: none; color: inherit; font-family: inherit; font-size: 13px; font-weight: 600; outline: none; }
        .icon-btn { background: transparent; border: none; color: var(--muted); cursor: pointer; font-size: 14px; padding: 2px 6px; border-radius: 4px; }
        .icon-btn:hover { color: var(--danger); background: rgba(255,255,255,0.08); }

        .export-bar { display: grid; grid-template-columns: 1fr 1.2fr auto auto; gap: 8px; }
        #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: #0f172a; color: #fff; border: 2px solid var(--primary); padding: 10px 22px; border-radius: 50px; font-weight: 800; font-size: 12.5px; z-index: 9999; opacity: 0; transition: 0.3s; pointer-events: none; }
        #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        @media (max-width: 1080px) { .workspace { grid-template-columns: 1fr; } .panel { height: 680px; } .meta-grid, .export-bar { grid-template-columns: 1fr 1fr; } }
    </style>
</head>
<body>

<div class="workspace">
    <!-- CỘT TRÁI: DÁN THẲNG ĐỀ TỪ PDF / WORD -->
    <div class="panel">
        <div class="panel-title">
            <span>📥 1. DÁN ĐỀ TỪ FILE PDF / WORD VÀO ĐÂY</span>
            <span style="font-size:11px; color:var(--success);">Tự nối dòng gãy PDF • Tự bắt dấu * và dấu -</span>
        </div>

        <div class="meta-grid">
            <input type="text" id="meta-id" class="input-box" placeholder="ID (de_noi_nha_01)" value="de_noi_nha_01">
            <input type="text" id="meta-title" class="input-box" placeholder="Tên bộ đề" value="Trắc Nghiệm Nội Nha Lâm Sàng">
            <select id="meta-spec" class="input-box">
                <option value="Nội nha">🦷 Nội nha</option>
                <option value="Nha chu">🩸 Nha chu</option>
                <option value="Phục hình">👑 Phục hình</option>
                <option value="Chỉnh nha">📏 Chỉnh nha</option>
                <option value="Phẫu thuật miệng">🔪 Phẫu thuật miệng</option>
                <option value="Răng trẻ em">🧒 Răng trẻ em</option>
                <option value="Bệnh học miệng">🔬 Bệnh học miệng</option>
                <option value="Chẩn đoán hình ảnh">🩻 Chẩn đoán hình ảnh</option>
            </select>
            <input type="text" id="meta-desc" class="input-box" placeholder="Mô tả ngắn" value="Đề chuẩn hóa CCHN 2027">
        </div>

        <div class="toolbar">
            <span style="font-size:11px; font-weight:900; color:var(--primary);">Bắt Word:</span>
            <label class="chk-label"><input type="checkbox" id="chk-underline" checked> Gạch chân</label>
            <label class="chk-label"><input type="checkbox" id="chk-color" checked> Đỏ/Highlight</label>
            <label class="chk-label"><input type="checkbox" id="chk-bold"> In đậm</label>
            <div style="flex:1;"></div>
            <button class="sc-btn" onclick="insertTag('[B]', '[/B]')"><b>B</b></button>
            <button class="sc-btn" onclick="insertTag('[RED]', '[/RED]')" style="color:#ef4444;">ĐỎ</button>
            <button class="sc-btn" onclick="insertTag('[BLUE]', '[/BLUE]')" style="color:#3b82f6;">XANH</button>
            <button class="sc-btn" onclick="promptImageInsert(-1)">🩻 Chèn X-Quang/Ảnh</button>
            <button class="sc-btn" onclick="addNewBlankQuestion()">➕ Thêm Câu</button>
        </div>

        <textarea id="raw-input" class="raw-area" oninput="parseRawToQuestions()" placeholder="Cứ Copy (Ctrl+C) thẳng từ file PDF bị gãy dòng, dính ngang A B C D hoặc có dấu - A., * B. rồi Dán (Ctrl+V) vào đây! Hệ thống sẽ tự động nối dòng và tách chuẩn 100%."></textarea>

        <div style="display:flex; gap:8px; align-items:center;">
            <span style="font-size:11.5px; font-weight:800; color:var(--warning); white-space:nowrap;">🔑 Đáp án rời:</span>
            <input type="text" id="ans-key-input" class="input-box" oninput="parseRawToQuestions()" placeholder="Nếu PDF không có dấu * hoặc -, gõ đáp án vào đây (VD: 1D 2A 3A 4B)...">
        </div>

    <!-- CỘT PHẢI: PREVIEW CHỈNH SỬA TRỰC TIẾP & COPY SANG SHEETS -->
    <div class="panel">
        <div class="panel-title">
            <span>👁️ 2. KẾT QUẢ ĐÃ LÀM SẠCH (CLICK ĐỂ SỬA TRỰC TIẾP)</span>
            <div class="filter-bar">
                <span class="f-pill active" onclick="setFilter('all', this)" id="pill-all">Tất cả (0)</span>
                <span class="f-pill" onclick="setFilter('err', this)" id="pill-err" style="color:#fca5a5;">⚠️ Thiếu Đ.Án (0)</span>
                <span class="f-pill" onclick="setFilter('exp', this)" id="pill-exp" style="color:#fde68a;">💡 Thiếu G.Thích (0)</span>
                <span class="f-pill" onclick="setFilter('dup', this)" id="pill-dup" style="color:#d8b4fe;">👯 Trùng lặp (0)</span>
            </div>
        </div>

        <div id="view-preview" class="preview-area"></div>

        <div class="export-bar">
            <button class="btn btn-success" onclick="copyColD()">📋 Copy Cột D</button>
            <button class="btn btn-primary" onclick="copyFullRowTSV()">🚀 Copy Hàng 4 Cột (Dán A2 Sheets)</button>
            <button class="btn btn-accent" onclick="testLive('Play')">⚡ Thi Thử Arena</button>
            <button class="btn" onclick="testLive('Flashcard')" style="border-color:var(--warning); color:var(--warning);">🃏 Lật Thẻ 3D</button>
        </div>
    </div>
</div>

<script>
    let questions = [];
    let currentFilter = 'all';
    let historyLog = JSON.parse(localStorage.getItem('rhm_studio_history') || '[]');

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg; t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2600);
    }

    function normalizeForDup(str) {
        return str.replace(/^Câu\s*\d+\s*[:.)\-]?\s*/i, '')
                  .replace(/\[IMG\].*?\[\/IMG\]/gi, '')
                  .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                  .toLowerCase().replace(/[^a-z0-9]/g, '');
    }

    function insertTag(open, close) {
        const ta = document.getElementById('raw-input');
        const s = ta.selectionStart, e = ta.selectionEnd, txt = ta.value;
        ta.value = txt.substring(0, s) + open + txt.substring(s, e) + close + txt.substring(e);
        ta.focus(); parseRawToQuestions();
    }

    function promptImageInsert(qIdx) {
        const url = prompt("🩻 Nhập đường dẫn (URL) hình ảnh X-quang, Giải phẫu hoặc Lâm sàng:");
        if (!url || !url.trim()) return;
        const tag = `[IMG]${url.trim()}[/IMG]`;
        if (qIdx === -1) {
            insertTag(tag, '');
        } else {
            questions[qIdx].title += " " + tag;
            syncPreviewToRaw(false);
            renderPreview();
        }
        showToast("🩻 Đã chèn hình ảnh lâm sàng!");
    }

    // Bắt định dạng Gạch chân, Chữ đỏ, Highlight từ Word
    document.getElementById('raw-input').addEventListener('paste', function(e) {
        const html = (e.clipboardData || window.clipboardData).getData('text/html');
        if (!html) return;
        const u = document.getElementById('chk-underline').checked;
        const c = document.getElementById('chk-color').checked;
        const b = document.getElementById('chk-bold').checked;
        if (!u && !c && !b) return;

        e.preventDefault();
        const div = document.createElement('div'); div.innerHTML = html;
        div.querySelectorAll('*').forEach(el => {
            const st = (el.getAttribute('style') || '').toLowerCase();
            const tag = el.tagName.toLowerCase();
            let mark = false;
            if (u && (tag === 'u' || st.includes('underline'))) mark = true;
            if (c && (tag === 'mark' || st.includes('mso-highlight') || st.includes('yellow') || st.includes('color:red') || st.includes('color: red') || st.includes('#ff0000') || st.includes('#c00000'))) mark = true;
            if (b && (tag === 'b' || tag === 'strong' || st.includes('bold')) && !el.innerText.trim().match(/^(Câu|Bài)\s*\d+/i)) mark = true;
            if (mark && el.innerText.trim() && !el.innerText.includes('[[C]]')) el.innerHTML = '[[C]]' + el.innerHTML;
        });
        div.querySelectorAll('p, div, li, br, tr').forEach(blk => {
            if (blk.tagName.toLowerCase() === 'br') blk.replaceWith('\n');
            else blk.prepend('\n');
        });
        let clean = (div.innerText || div.textContent).replace(/(\[\[C\]\])+/g, '*');
        const s = this.selectionStart, end = this.selectionEnd;
        this.value = this.value.substring(0, s) + clean.trim() + this.value.substring(end);
        parseRawToQuestions();
        saveSnapshot('Dán đề mới');
    });

    function parseAnswerKey() {
        const raw = document.getElementById('ans-key-input').value.toUpperCase();
        const map = {};
        const regex = /(\d+)\s*[:.\-]?\s*([A-F]+)/g;
        let m;
        while ((m = regex.exec(raw)) !== null) {
            map[parseInt(m[1], 10)] = m[2].split('').map(ch => ch.charCodeAt(0) - 65);
        }
        return map;
    }

    // THUẬT TOÁN PDF SMART-CLEAN: TỰ NỐI DÒNG GÃY & BẮT DẤU * / -
    function parseRawToQuestions() {
        let raw = document.getElementById('raw-input').value;
        const keyMap = parseAnswerKey();

        // 1. Tách các đáp án nằm ngang trên cùng 1 dòng (bao gồm cả "A. ... * D. ..." hoặc "- A. ... B. ...")
        // Tránh tách nhầm cụm "Cả A và B" vì cụm đó không có dấu chấm/ngoặc đơn sau chữ A, B
        const inlineOptRegex = /([^\n])\s+((?:[\*\-•]\s*)?[A-E][\.\)]\s+)/g;
        raw = raw.replace(inlineOptRegex, '$1\n$2');
        raw = raw.replace(inlineOptRegex, '$1\n$2');

        const lines = raw.split(/\r?\n/);
        questions = [];
        let curr = null, qNum = 0;

        lines.forEach(line => {
            line = line.trim();
            if (!line) return;

            // 2. Nhận diện dòng bắt đầu Câu hỏi mới ("Câu 1:", "Bài 1.", "1:")
            const qMatch = line.match(/^(?:Câu|Bài|Question)\s*(\d+)\s*[:.)\-]?\s*(.*)$/i) ||
                           ((!curr || curr.opts.length >= 2) && line.match(/^(\d+)\s*[:.)]\s+(.+)$/));

            if (qMatch) {
                if (curr) questions.push(curr);
                qNum++;
                let cleanT = (qMatch[2] || '').replace(/\[?(Chọn )?\d+ đáp án\]?/gi, '').trim();
                curr = { title: `Câu ${qNum}: ${cleanT}`, opts: [], explanation: "", inExp: false };
                return;
            }

            if (!curr) {
                qNum++;
                curr = { title: `Câu ${qNum}: ${line}`, opts: [], explanation: "", inExp: false };
                return;
            }

            // 3. Nhận diện từ khóa Giải thích tường minh
            const expMatch = line.match(/^(?:💡\s*)?(?:Giải thích|Lời giải|Hướng dẫn|HD|=>)\s*[:\-]?\s*(.+)$/i);
            if (expMatch) {
                curr.inExp = true;
                curr.explanation += (curr.explanation ? "<br>" : "") + expMatch[1].trim();
                return;
            }

            // 4. Nhận diện dòng Đáp án:
            // Hỗ trợ: "* D. ...", "- A. ...", "• B. ...", "A. ...", "* Nội dung", "• Nội dung"
            const letterOpt = line.match(/^(\*|\-|•|\[x\])?\s*([A-E])[\.\)]\s*(.+)$/i);
            const symbolOpt = line.match(/^(\*|•)\s+(.+)$/);

            if (letterOpt) {
                curr.inExp = false;
                const prefix = (letterOpt[1] || '').trim();
                let txt = letterOpt[3].trim();
                // Dấu * hoặc dấu - hoặc [x] đứng trước A. B. C. D. đều được tính là đáp án đúng
                let isC = (prefix === '*' || prefix === '-' || prefix.toLowerCase() === '[x]' || txt.startsWith('*'));
                txt = txt.replace(/^\*+|\*+$/g, '').trim();
                curr.opts.push({ text: txt, isC: isC });
                return;
            }

            if (symbolOpt) {
                curr.inExp = false;
                curr.opts.push({ text: symbolOpt[2].trim(), isC: symbolOpt[1] === '*' });
                return;
            }

            // 5. XỬ LÝ DÒNG PDF BỊ RỚT (NỐI DÒNG THÔNG MINH):
            // Nếu chưa có đáp án nào -> nối tiếp vào câu hỏi (VD: "kính hiển vi" + "nha khoa là")
            if (curr.opts.length === 0) {
                curr.title += " " + line;
            } else if (curr.inExp) {
                // Nếu đang trong khối Giải thích -> nối vào giải thích
                curr.explanation += " " + line;
            } else {
                // Nếu đang ở danh sách đáp án mà bị rớt dòng (VD: "không để lại khoảng" + "trống") -> nối thẳng vào đáp án vừa tạo!
                curr.opts[curr.opts.length - 1].text += " " + line;
            }
        });

        if (curr) questions.push(curr);

        // Áp dụng bảng đáp án rời nếu người dùng nhập
        questions.forEach((q, idx) => {
            const k = keyMap[idx + 1];
            if (k && k.length) q.opts.forEach((o, oIdx) => { o.isC = k.includes(oIdx); });
        });

        renderPreview();
        autoSaveDraft();
    }

    function renderPreview() {
        const cont = document.getElementById('view-preview');
        cont.innerHTML = '';

        let errCount = 0, expCount = 0, dupCount = 0;
        const seenMap = {};

        questions.forEach((q, idx) => {
            const norm = normalizeForDup(q.title);
            q.dupOf = null;
            if (norm.length > 6) {
                if (seenMap[norm] !== undefined) {
                    q.dupOf = seenMap[norm] + 1;
                    dupCount++;
                } else {
                    seenMap[norm] = idx;
                }
            }
            const cCount = q.opts.filter(o => o.isC).length;
            q.hasErr = (cCount === 0 || q.opts.length < 2);
            q.missingExp = (!q.explanation || q.explanation.trim().length === 0);
            if (q.hasErr) errCount++;
            if (q.missingExp) expCount++;
        });

        document.getElementById('pill-all').innerText = `Tất cả (${questions.length})`;
        document.getElementById('pill-err').innerText = `⚠️ Thiếu Đ.Án (${errCount})`;
        document.getElementById('pill-exp').innerText = `💡 Thiếu G.Thích (${expCount})`;
        document.getElementById('pill-dup').innerText = `👯 Trùng lặp (${dupCount})`;

        questions.forEach((q, qIdx) => {
            if (currentFilter === 'err' && !q.hasErr) return;
            if (currentFilter === 'exp' && !q.missingExp) return;
            if (currentFilter === 'dup' && !q.dupOf) return;

            const cCount = q.opts.filter(o => o.isC).length;
            const card = document.createElement('div');
            card.className = `q-card ${q.hasErr ? 'err-ans' : ''} ${q.missingExp ? 'warn-exp' : ''} ${q.dupOf ? 'warn-dup' : ''}`;

            const imgs = [...q.title.matchAll(/\[IMG\](.*?)\[\/IMG\]/gi)].map(m => m[1]);
            const imgHTML = imgs.length ? `<div class="img-preview-row">${imgs.map(u => `<img src="${u}" class="img-thumb" onerror="this.style.display='none'">`).join('')}</div>` : '';

            let optsHTML = '';
            q.opts.forEach((o, oIdx) => {
                optsHTML += `
                    <div class="q-opt ${o.isC ? 'is-correct' : ''}">
                        <input type="checkbox" ${o.isC ? 'checked' : ''} onchange="toggleOpt(${qIdx}, ${oIdx}, this.checked)" title="Tích chọn đáp án đúng">
                        <input type="text" value="${o.text.replace(/"/g, '&quot;')}" oninput="editOpt(${qIdx}, ${oIdx}, this.value)">
                        <button class="icon-btn" onclick="removeOpt(${qIdx}, ${oIdx})" title="Xóa phương án">&times;</button>
                    </div>
                `;
            });

            card.innerHTML = `
                <div class="q-head">
                    <div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap;">
                        <span style="color:var(--primary);">CÂU #${qIdx + 1}</span>
                        ${cCount > 1 ? `<span class="badge b-multi">🔀 NHIỀU ĐÁP ÁN (${cCount})</span>` : ''}
                        ${q.dupOf ? `<span class="badge b-dup">👯 Trùng Câu #${q.dupOf}</span>` : ''}
                        ${q.hasErr ? `<span class="badge b-err">⚠️ Chưa chọn đáp án đúng</span>` : ''}
                        ${q.missingExp ? `<span class="badge b-warn">💡 Chưa có giải thích</span>` : ''}
                    </div>
                    <div style="display:flex; gap:4px;">
                        <button class="sc-btn" onclick="promptImageInsert(${qIdx})">🩻 +Ảnh</button>
                        <button class="sc-btn" onclick="addOpt(${qIdx})">➕ +Đ.Án</button>
                        <button class="sc-btn" style="color:var(--danger);" onclick="deleteQuestion(${qIdx})">🗑️ Xóa</button>
                    </div>
                </div>
                <input type="text" class="q-title-edit" value="${q.title.replace(/"/g, '&quot;')}" oninput="editTitle(${qIdx}, this.value)">
                ${imgHTML}
                <div>${optsHTML}</div>
                <input type="text" class="input-box" style="margin-top:6px;" value="${q.explanation.replace(/"/g, '&quot;')}" placeholder="💡 Nhập giải thích lâm sàng (không bắt buộc)..." oninput="editExp(${qIdx}, this.value)">
            `;
            cont.appendChild(card);
        });
    }

    function setFilter(f, el) {
        currentFilter = f;
        document.querySelectorAll('.f-pill').forEach(p => p.classList.remove('active'));
        el.classList.add('active');
        renderPreview();
    }

    function toggleOpt(qIdx, oIdx, checked) { questions[qIdx].opts[oIdx].isC = checked; renderPreview(); autoSaveDraft(); }
    function editOpt(qIdx, oIdx, val) { questions[qIdx].opts[oIdx].text = val; autoSaveDraft(); }
    function editTitle(qIdx, val) { questions[qIdx].title = val; autoSaveDraft(); }
    function editExp(qIdx, val) { questions[qIdx].explanation = val; autoSaveDraft(); }
    function addOpt(qIdx) { questions[qIdx].opts.push({ text: "Phương án mới", isC: false }); renderPreview(); }
    function removeOpt(qIdx, oIdx) { questions[qIdx].opts.splice(oIdx, 1); renderPreview(); }
    function deleteQuestion(qIdx) { questions.splice(qIdx, 1); syncPreviewToRaw(false); renderPreview(); }
    function addNewBlankQuestion() {
        const n = questions.length + 1;
        questions.push({
            title: `Câu ${n}: Nhập nội dung câu hỏi lâm sàng mới...`,
            opts: [{ text: "Phương án A", isC: true }, { text: "Phương án B", isC: false }, { text: "Phương án C", isC: false }, { text: "Phương án D", isC: false }],
            explanation: ""
        });
        syncPreviewToRaw(false); renderPreview();
    }

    function buildStandardString() {
        return questions.map((q, idx) => {
            let cleanTitle = q.title.replace(/^Câu\s*\d+\s*[:.)\-]?\s*/i, '');
            let header = `Câu ${idx + 1}: ${cleanTitle}`;
            let opts = q.opts.map(o => `${o.isC ? '*' : '•'} ${o.text}`).join('\n');
            return header + '\n' + opts + (q.explanation ? '\n' + q.explanation : '');
        }).join('\n\n').trim();
    }

    function syncPreviewToRaw(notify = true) {
        document.getElementById('raw-input').value = buildStandardString();
        if (notify) showToast("✨ Đã biến ô văn bản bên trái thành chuẩn * và •!");
    }

    function copyColD() {
        const code = buildStandardString();
        if (!code) return showToast("⚠️ Chưa có câu hỏi!");
        navigator.clipboard.writeText(code);
        showToast("📋 Đã copy Cột D! Nháy đúp vào ô D2 trên Sheets rồi Ctrl+V.");
    }

    function copyFullRowTSV() {
        const code = buildStandardString();
        if (!code) return showToast("⚠️ Chưa có câu hỏi!");
        const id = document.getElementById('meta-id').value.trim() || 'de_rhm_01';
        const title = document.getElementById('meta-title').value.trim() || 'Đề RHM';
        const spec = document.getElementById('meta-spec').value;
        const desc = `[${spec}] ` + (document.getElementById('meta-desc').value.trim() || `${questions.length} câu hỏi`);
        const escaped = '"' + code.replace(/"/g, '""') + '"';
        navigator.clipboard.writeText(`${id}\t${title}\t${desc}\t${escaped}`);
        saveSnapshot('Xuất TSV Sheets');
        showToast("🚀 Đã copy nguyên hàng 4 cột! Chỉ cần bấm 1 lần vào ô A2 trên Sheets rồi Ctrl+V.");
    }

    function exportJSON() {
        const payload = {
            id: document.getElementById('meta-id').value.trim(),
            title: document.getElementById('meta-title').value.trim(),
            specialty: document.getElementById('meta-spec').value,
            description: document.getElementById('meta-desc').value.trim(),
            exportedAt: new Date().toISOString(),
            questions: questions
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `${payload.id || 'rhm_bank'}.json`;
        a.click();
        showToast("📥 Đã xuất ngân hàng câu hỏi ra file JSON!");
    }

    function importJSON(e) {
        const file = e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
            try {
                const data = JSON.parse(evt.target.result);
                document.getElementById('meta-id').value = data.id || 'de_json';
                document.getElementById('meta-title').value = data.title || 'Đề Nhập JSON';
                if (data.specialty) document.getElementById('meta-spec').value = data.specialty;
                document.getElementById('meta-desc').value = data.description || '';
                questions = data.questions || [];
                syncPreviewToRaw(false);
                renderPreview();
                saveSnapshot('Nhập file JSON');
                showToast("📤 Đã nạp ngân hàng câu hỏi JSON thành công!");
            } catch (err) { alert("❌ File JSON không đúng định dạng!"); }
        };
        reader.readAsText(file);
    }

    function autoSaveDraft() {
        localStorage.setItem('rhm_studio_autosave', JSON.stringify({
            id: document.getElementById('meta-id').value,
            title: document.getElementById('meta-title').value,
            spec: document.getElementById('meta-spec').value,
            desc: document.getElementById('meta-desc').value,
            raw: buildStandardString()
        }));
    }

    function saveSnapshot(label = 'Bản lưu') {
        const raw = buildStandardString();
        if (!raw) return;
        const time = new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        historyLog.unshift({
            label: `${time} - ${label} (${questions.length} câu)`,
            id: document.getElementById('meta-id').value,
            title: document.getElementById('meta-title').value,
            spec: document.getElementById('meta-spec').value,
            desc: document.getElementById('meta-desc').value,
            raw: raw
        });
        historyLog = historyLog.slice(0, 10);
        localStorage.setItem('rhm_studio_history', JSON.stringify(historyLog));
        renderHistorySelect();
        showToast("💾 Đã lưu vào lịch sử chỉnh sửa!");
    }

    function renderHistorySelect() {
        const sel = document.getElementById('history-select');
        sel.innerHTML = `<option value="">🕒 Lịch sử chỉnh sửa (${historyLog.length})</option>` +
            historyLog.map((h, i) => `<option value="${i}">${h.label}</option>`).join('');
    }

    function restoreHistory(idx) {
        if (idx === "") return;
        const h = historyLog[parseInt(idx, 10)];
        if (!h) return;
        document.getElementById('meta-id').value = h.id || '';
        document.getElementById('meta-title').value = h.title || '';
        if (h.spec) document.getElementById('meta-spec').value = h.spec;
        document.getElementById('meta-desc').value = h.desc || '';
        document.getElementById('raw-input').value = h.raw || '';
        parseRawToQuestions();
        document.getElementById('history-select').value = "";
        showToast("⏪ Đã khôi phục phiên bản từ lịch sử!");
    }

    function testLive(page) {
        const code = buildStandardString();
        if (!code) return showToast("⚠️ Chưa có câu hỏi!");
        const id = document.getElementById('meta-id').value.trim() || 'test_studio';
        const title = document.getElementById('meta-title').value.trim() || 'Đề Test Studio';
        localStorage.setItem(id, code);
        window.open(`${page}.html?id=${encodeURIComponent(id)}&title=${encodeURIComponent(title)}`, '_blank');
    }

    // Nạp sẵn đúng 4 câu PDF của bạn để kiểm tra ngay
    function loadSample() {
        document.getElementById('raw-input').value = `Câu 1: Mức độ phóng đại thông thường của một kính hiển vi
nha khoa là
A. 1,5 đến 25 lần B. 1,5 đến 20 lần
C. 1,5 đến 35 lần * D. 1,5 đến 30 lần
Câu 2: Khẳng định nào sau đây là đúng về việc trám bít ống tủy,trừ
- A. Trám bít để đưa chất trám ra ngoài lỗ chóp chân răng
B. Với răng chưa đóng chóp là dùng kĩ thuật sinh chóp
C. Trám bít để vi khuẩn không phát triển
D. Trám bít để bịt kín hệ thống ống tủy không để lại khoảng
trống
Câu 3: Vật liệu trám ngược nào sau đây có tính tương hợp
sinh học kém nhất
- A. Amalgan B. MTA
C. IRM D. Biodentine
Câu 4: Để tăng hiệu quả của thuốc đặt nội tuỷ, có thể trộn
Ca(OH)2 với chất nào sau đây?
A. Cả A và B đúng * B. Chlorhexidine
C. Cả A và B sai D. NaOCl`;
        parseRawToQuestions();
        showToast("📄 Đã tự động nối dòng gãy PDF và nhận diện cả dấu * lẫn dấu -!");
    }

    window.onload = () => {
        renderHistorySelect();
        loadSample();
    };
</script>
