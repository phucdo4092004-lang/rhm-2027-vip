<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hạm Đội RHM - Phúc VIP</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00f2fe; --primary-grad: linear-gradient(90deg, #00f2fe, #4facfe); --bg-theme: radial-gradient(circle at center, #1e1b4b 0%, #020617 100%); }
        [data-theme="dark"] { --bg-card: rgba(15, 23, 42, 0.85); --text: #f8fafc; --opt-bg: rgba(255,255,255,0.05); --border: rgba(255,255,255,0.1); --drawer: rgba(15, 23, 42, 0.95); }
        [data-theme="light"] { --bg-card: rgba(255, 255, 255, 0.9); --text: #0f172a; --opt-bg: #f1f5f9; --border: rgba(0,0,0,0.1); --drawer: #ffffff; }

        body { font-family: 'Plus Jakarta Sans', sans-serif; color: var(--text); margin: 0; overflow: hidden; height: 100vh; background: #000; transition: 0.3s; }
        #universe { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -3; background: var(--bg-theme); transition: 1s; }
        #floating-objects { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; pointer-events: none; }
        .emoji-floater { position: absolute; font-size: 40px; animation: floatRandom 20s infinite linear alternate; opacity: 0.6; }
        @keyframes floatRandom { 100% { transform: translate(100px, -100px) rotate(360deg); } }

        .sticky-header { position: fixed; top: 0; width: 100%; padding: 10px 20px; background: rgba(0,0,0,0.8); backdrop-filter: blur(15px); z-index: 1000; border-bottom: 1px solid var(--primary); display: flex; flex-direction: column; gap: 8px; box-sizing: border-box; }
        .header-top { display: flex; justify-content: space-between; align-items: center; }
        .btn-tool { background: var(--opt-bg); color: var(--primary); border: 1px solid var(--primary); padding: 5px 12px; border-radius: 12px; font-weight: 800; cursor: pointer; font-size: 11px; text-decoration: none; }
        
        #quiz-container { display: flex; align-items: center; justify-content: center; height: 100vh; padding: 20px; box-sizing: border-box; }
        .question-box { background: var(--bg-card); width: 95%; max-width: 700px; padding: 30px; border-radius: 30px; border: 1.5px solid var(--primary); display: none; box-shadow: 0 20px 50px rgba(0,0,0,0.5); max-height: 80vh; overflow-y: auto; }
        .question-box.active { display: block; animation: pop 0.4s ease; }
        @keyframes pop { 0% { transform: scale(0.95); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        .option { background: var(--opt-bg); padding: 15px 20px; margin-bottom: 10px; border-radius: 15px; cursor: pointer; border: 2px solid var(--border); transition: 0.2s; font-weight: 600; font-size: 16px; }
        .option:hover { border-color: var(--primary); transform: translateX(5px); }
        .correct { background: rgba(16, 185, 129, 0.2) !important; border-color: #10b981 !important; color: #6ee7b7 !important; }
        .wrong { background: rgba(239, 68, 68, 0.2) !important; border-color: #ef4444 !important; color: #fca5a5 !important; }
        .disabled { pointer-events: none; opacity: 0.7; }

        /* SHORTCODE STYLES */
        .sc-img { display: block; max-width: 100%; border-radius: 15px; margin: 15px auto; border: 2px solid var(--primary); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .sc-red { color: #ff4d4d; font-weight: 800; }
        .sc-blue { color: #4da6ff; font-weight: 800; }

        /* TOOLS & WIDGETS */
        .nav-arrow { position: fixed; top: 50%; background: rgba(0,0,0,0.5); border: 2px solid var(--primary); color: var(--primary); width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: 900; z-index: 100; transform: translateY(-50%); }
        #nav-prev { left: 15px; } #nav-next { right: 15px; }
        
        .donate-badge { position: fixed; bottom: 20px; left: 20px; background: var(--bg-card); border: 1.5px solid #ff00de; padding: 10px 15px; border-radius: 15px; font-size: 12px; font-weight: 800; cursor: pointer; z-index: 1000; box-shadow: 0 0 15px rgba(255,0,222,0.2); }
        .progress-bar { position: fixed; bottom: 0; left: 0; height: 5px; background: var(--primary-grad); width: 0%; transition: 0.3s; box-shadow: 0 0 10px var(--primary); z-index: 1000;}
        
        #map-drawer { position: fixed; top: 0; right: -340px; width: 300px; height: 100vh; background: var(--drawer); border-left: 2px solid var(--primary); z-index: 9999; transition: 0.4s; padding: 25px; box-sizing: border-box; overflow-y: auto; }
        #map-drawer.open { right: 0; }
        .node-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 20px; }
        .node { aspect-ratio: 1; border-radius: 10px; background: var(--opt-bg); display: flex; align-items: center; justify-content: center; font-weight: 800; cursor: pointer; border: 1.5px solid var(--border); font-size: 13px; }
        .node-correct { background: #10b981; color: #fff; border-color: #10b981; }
        .node-wrong { background: #ef4444; color: #fff; border-color: #ef4444; }
        .node-active { border: 2.5px solid var(--primary); transform: scale(1.1); box-shadow: 0 0 15px var(--primary); z-index: 10; }

        #builder { position: fixed; bottom: 20px; right: 20px; background: var(--bg-card); padding: 12px; border-radius: 20px; border: 1.5px solid var(--primary); width: 110px; text-align: center; }
        .house-part { width: 35px; height: 35px; background: #334155; margin: 3px auto; border-radius: 5px; opacity: 0.2; transition: 0.5s; }
        .built { opacity: 1; background: var(--primary); box-shadow: 0 0 10px var(--primary); }

        #streak-toast { position: fixed; top: 120px; left: 50%; transform: translateX(-50%) scale(0); background: linear-gradient(45deg, #ff0f7b, #f89b29); color: #fff; padding: 10px 25px; border-radius: 30px; font-weight: 900; z-index: 2000; transition: 0.3s; pointer-events: none; }
        #streak-toast.show { transform: translateX(-50%) scale(1); }

        #end-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.9); backdrop-filter: blur(15px); z-index: 10000; display: none; flex-direction: column; justify-content: center; align-items: center; }
        .end-box { background: var(--bg-card); border: 2px solid var(--primary); border-radius: 30px; padding: 40px; text-align: center; max-width: 500px; width: 90%; }
        .btn-end { width: 100%; padding: 15px; margin: 5px 0; border-radius: 15px; border: none; font-weight: 900; cursor: pointer; text-transform: uppercase; }
        .jump-loader { display: none; margin-top: 15px; text-align: center; }
        .jump-bar-fill { height: 4px; background: var(--primary); width: 100%; margin-top: 5px; border-radius: 10px;}
    </style>
</head>
<body>

<div id="universe"></div>
<div id="floating-objects"></div>
<div id="streak-toast">🔥 COMBO x3</div>

<div class="sticky-header">
    <div class="header-top">
        <div style="display:flex; align-items:center;">
            <a href="index.html" class="btn-tool" style="background:var(--primary); color:#000;">⬅ THOÁT</a>
            <span id="de-title" style="margin-left:15px; font-weight:900; color:var(--primary); font-size:15px;">ĐANG TẢI...</span>
        </div>
        <div class="header-controls">
            <button class="btn-tool" onclick="adjSize(2)">A+</button>
            <button class="btn-tool" onclick="adjSize(-2)">A-</button>
            <select id="voice-sel" class="btn-tool" style="max-width:80px;"></select>
            <div style="font-size:10px; color:var(--primary); font-weight:800; display:flex; align-items:center;">🐢<input type="range" id="speed" min="0.5" max="2" step="0.1" value="1" style="width:50px;">🚀</div>
            <button class="btn-tool" style="background:#ff00de; color:#fff;" onclick="speak()">🔊 ĐỌC</button>
        </div>
    </div>
    <div class="header-top" style="margin-top: 5px;">
        <select class="btn-tool" onchange="changeTheme(this.value)">
            <option value="space">🌌 Vũ Trụ</option>
            <option value="spring">🌸 Mùa Xuân</option>
            <option value="summer">☀️ Mùa Hạ</option>
            <option value="autumn">🍂 Mùa Thu</option>
            <option value="winter">❄️ Mùa Đông</option>
            <option value="love">💖 Tình Yêu</option>
            <option value="animals">🐾 Động Vật</option>
            <option value="nature">🌲 Thiên Nhiên</option>
            <option value="tech">💻 Công Nghệ</option>
        </select>
        <div style="display:flex; gap:8px;">
            <button onclick="toggleMode()" class="btn-tool">🌓</button>
            <button onclick="toggleMap()" class="btn-tool" style="background:var(--primary); color:#000;">🗺️ MAP</button>
            <div style="color:#facc15; font-weight:900; font-size:12px; background:var(--opt-bg); padding:5px 10px; border-radius:10px; border:1px solid #facc15;" id="score-text">Đúng: 0%</div>
        </div>
    </div>
</div>

<div id="nav-prev" class="nav-arrow" onclick="move(-1)">&lt;</div>
<div id="nav-next" class="nav-arrow" onclick="move(1)">&gt;</div>

<div id="quiz-container"></div>

<div id="map-drawer">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3 style="color:var(--primary); margin:0;">BẢN ĐỒ CÂU HỎI</h3>
        <button onclick="toggleMap()" style="background:none; border:none; color:#ef4444; font-size:24px; cursor:pointer;">&times;</button>
    </div>
    <div class="node-grid" id="node-grid"></div>
</div>

<div id="builder">
    <div style="font-size:9px; font-weight:900; margin-bottom:8px;">CÔNG TRÌNH</div>
    <div id="p1" class="house-part"></div><div id="p2" class="house-part"></div><div id="p3" class="house-part"></div>
    <div id="stt-build" style="font-size:8px; font-weight:800; margin-top:5px; color:var(--primary);">CHỜ KHỞI CÔNG</div>
</div>

<div class="progress-bar" id="progress-bar"></div>

<div class="donate-badge" onclick="copySTK()">💖 Donate Phúc: <b style="color:#ff00de;">BIDV 8812766209</b></div>

<div id="end-screen">
    <div class="end-box">
        <h2 style="color:var(--primary); font-weight:900; margin-top:0;">HOÀN THÀNH CHIẾN DỊCH!</h2>
        <div style="font-size: 60px; font-weight: 900;" id="final-score">100%</div>
        <div id="final-rank" style="color: #facc15; font-weight: 800; margin-bottom: 20px;">THỦ KHOA RHM</div>
        <button class="btn-end" style="background:#10b981; color:#fff;" onclick="closeEndScreen()">Xem lại bài</button>
        <button class="btn-end" style="background:var(--primary-grad); color:#000;" onclick="initGame('wrong')">Làm lại câu sai</button>
        <button class="btn-end" style="background:#fff; color:#000;" onclick="initGame('all')">Làm lại từ đầu</button>
    </div>
</div>

<script>
    let originalQ = []; let questions = []; let currentIdx = 0; let score = 0; let done = 0;
    let streak = 0; let fontSize = 18; let jumpTimer = null; let audioCtx = null;
    let synth = window.speechSynthesis; let viVoices = [];

    // Giải mã Mật mã từ Google Sheets
    function parseSC(txt) {
        return txt.replace(/\[IMG\](.*?)\[\/IMG\]/gi, '<img src="$1" class="sc-img">')
                  .replace(/\[B\](.*?)\[\/B\]/gi, '<b>$1</b>')
                  .replace(/\[RED\](.*?)\[\/RED\]/gi, '<span class="sc-red">$1</span>')
                  .replace(/\[BLUE\](.*?)\[\/BLUE\]/gi, '<span class="sc-blue">$1</span>')
                  .replace(/\[BR\]/gi, '<br>');
    }

    const themes = {
        space: { bg: 'radial-gradient(circle at center, #1e1b4b 0%, #020617 100%)', p: '#00f2fe', obj: ['🛸','🚀','🌌'] },
        spring: { bg: 'linear-gradient(to bottom, #2e1437, #943b54)', p: '#ff7eb3', obj: ['🌸','🦋','🌷'] },
        summer: { bg: 'linear-gradient(to bottom, #001d3d, #00b4db)', p: '#f6d365', obj: ['🌻','☀️','🍉'] },
        autumn: { bg: 'linear-gradient(to bottom, #3f2b96, #a8c0ff)', p: '#ff9966', obj: ['🍁','🍂','🐿️'] },
        winter: { bg: 'linear-gradient(to bottom, #141e30, #243b55)', p: '#a1c4fd', obj: ['❄️','⛄','🐧'] },
        love: { bg: 'linear-gradient(to bottom, #43000b, #ff0f7b)', p: '#ff0844', obj: ['💖','🌹','💌'] },
        animals: { bg: 'linear-gradient(to bottom, #134e5e, #71b280)', p: '#2ebf91', obj: ['🦁','🐼','🐾'] },
        nature: { bg: 'linear-gradient(to bottom, #0f2027, #2c5364)', p: '#11998e', obj: ['🌲','🌈','🍄'] },
        tech: { bg: 'radial-gradient(circle at center, #000000, #434343)', p: '#00ff00', obj: ['💻','🤖','⚡'] }
    };

    function copySTK() { navigator.clipboard.writeText('8812766209'); alert("Đã copy STK Phúc Đẹp Trai!"); }
    function toggleMode() { const h = document.documentElement; h.setAttribute('data-theme', h.getAttribute('data-theme')==='dark'?'light':'dark'); }
    function toggleMap() { document.getElementById('map-drawer').classList.toggle('open'); }
    function adjSize(v) { fontSize += v; document.querySelectorAll('.question-title').forEach(e => e.style.fontSize = fontSize + 'px'); }

    function populateVoices() {
        viVoices = synth.getVoices().filter(v => v.lang.includes('vi'));
        document.getElementById('voice-sel').innerHTML = viVoices.length ? viVoices.map((v, i) => `<option value="${i}">${v.name.substring(0,8)}</option>`).join('') : '<option value="">No VN</option>';
    }
    populateVoices(); if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = populateVoices;

    function speak() {
        if (synth.speaking) { synth.cancel(); return; }
        const q = questions[currentIdx];
        let text = q.title.replace(/<[^>]*>?/gm, '') + ". ";
        q.opts.forEach((o, i) => text += `Lựa chọn ${i+1}: ${o.text.replace(/<[^>]*>?/gm, '')}. `);
        const utter = new SpeechSynthesisUtterance(text);
        utter.voice = viVoices[document.getElementById('voice-sel').value];
        utter.rate = document.getElementById('speed').value;
        synth.speak(utter);
    }

    // ĐỌC DỮ LIỆU TỪ LOCAL STORAGE (Do index.html đẩy sang)
    window.onload = function() {
        const id = new URLSearchParams(window.location.search).get('id');
        const title = new URLSearchParams(window.location.search).get('title');
        if(!id) { location.href='index.html'; return; }
        document.getElementById('de-title').innerText = title || "BỘ ĐỀ RHM";

        const rawData = localStorage.getItem(id);
        if(!rawData) {
            document.getElementById('quiz-container').innerHTML = "<div style='color:#fff'>Lỗi kết nối CSDL Sheets. Trở lại sảnh để tải lại.</div>";
            return;
        }

        let q = null;
        rawData.split(/\\n|\n/).forEach(line => {
            line = line.trim(); if(!line) return;
            if(line.match(/^Câu\s*\d+:/i)) {
                if(q) originalQ.push(q);
                q = { title: parseSC(line.replace(/^Câu\s*\d+:/i, '').trim()), opts: [], ans: null };
            } else if(line.startsWith('*')) {
                if(q) q.opts.push({ text: parseSC(line.substring(1).trim()), isC: true });
            } else if(line.startsWith('•')) {
                if(q) q.opts.push({ text: parseSC(line.substring(1).trim()), isC: false });
            } else if(q && q.opts.length === 0) {
                q.title += "<br>" + parseSC(line);
            }
        });
        if(q) originalQ.push(q);
        
        if(originalQ.length === 0) {
            document.getElementById('quiz-container').innerHTML = "<div style='color:#fff'>Đề thi trống! Sếp kiểm tra lại cột Content trên Sheets nhé.</div>"; return;
        }

        initGame('all'); changeTheme('space');
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
    };

    function initGame(mode) {
        if(jumpTimer) clearInterval(jumpTimer);
        document.getElementById('end-screen').style.display = 'none';
        questions = mode === 'all' ? JSON.parse(JSON.stringify(originalQ)) : questions.filter(x => x.ans === false);
        questions.forEach(q => q.ans = null);
        currentIdx = 0; score = 0; done = 0; streak = 0;
        document.getElementById('quiz-container').innerHTML = '';
        render(); buildMap(); show(0); updateStats();
    }

    function render() {
        const cont = document.getElementById('quiz-container');
        questions.forEach((q, i) => {
            const div = document.createElement('div'); div.className = 'question-box'; div.id = 'q-'+i;
            div.innerHTML = `<div style="text-align:center; color:var(--primary); font-weight:900; margin-bottom:15px; font-size:12px;">CÂU ${i+1} / ${questions.length}</div>
                             <div class="question-title" style="font-size:${fontSize}px; font-weight:800; margin-bottom:25px; text-align:center;">${q.title}</div>
                             <div class="opts"></div>
                             <div class="jump-loader" id="loader-${i}">
                                <div style="font-size:10px; font-weight:800; color:var(--primary);">CHUYỂN CÂU...</div>
                                <div class="jump-bar-fill" id="fill-${i}"></div>
                             </div>`;
            const oCont = div.querySelector('.opts');
            q.opts.forEach((opt, oIdx) => {
                const oDiv = document.createElement('div'); oDiv.className = 'option'; oDiv.innerHTML = opt.text;
                oDiv.onclick = function() {
                    if(q.ans !== null) return; q.ans = opt.isC; done++;
                    Array.from(oCont.children).forEach(c => c.classList.add('disabled'));
                    if(opt.isC) { this.classList.add('correct'); score++; streak++; playSfx(true); if(streak >= 3) showStreak(); }
                    else { this.classList.add('wrong'); streak = 0; playSfx(false); Array.from(oCont.children).forEach((c, x) => { if(q.opts[x].isC) c.classList.add('correct'); }); }
                    updateStats(); updateNode(i); startJump(i);
                };
                oCont.appendChild(oDiv);
            });
            cont.appendChild(div);
        });
    }

    function show(i) {
        if(synth.speaking) synth.cancel();
        document.querySelectorAll('.question-box').forEach(b => b.classList.remove('active'));
        document.getElementById('q-'+i).classList.add('active');
        document.querySelectorAll('.node').forEach(n => n.classList.remove('node-active'));
        document.getElementById('node-'+i).classList.add('node-active');
        currentIdx = i;
        document.getElementById('nav-prev').style.display = i > 0 ? 'flex' : 'none';
        document.getElementById('nav-next').style.display = i < questions.length - 1 ? 'flex' : 'none';
    }

    function move(d) {
        if(jumpTimer) clearInterval(jumpTimer);
        let n = currentIdx + d; if(n >= 0 && n < questions.length) show(n);
    }

    function startJump(i) {
        if(i >= questions.length - 1) { setTimeout(showEndScreen, 1500); return; }
        const l = document.getElementById(`loader-${i}`); const f = document.getElementById(`fill-${i}`);
        l.style.display = 'block'; let w = 100;
        jumpTimer = setInterval(() => { w -= 5; f.style.width = w + '%'; if(w <= 0) { clearInterval(jumpTimer); move(1); } }, 50);
    }

    function updateStats() {
        const p = Math.round((score / (done || 1)) * 100);
        document.getElementById('score-text').innerText = `Đúng: ${p}%`;
        const prog = (done / questions.length) * 100;
        document.getElementById('progress-bar').style.width = prog + '%';
        if(prog > 0) document.getElementById('p1').classList.add('built');
        if(prog >= 50) document.getElementById('p2').classList.add('built');
        if(prog === 100) { document.getElementById('p3').classList.add('built'); document.getElementById('stt-build').innerText = "HOÀN THÀNH! 🚀"; }
    }

    function buildMap() {
        const g = document.getElementById('node-grid'); g.innerHTML = '';
        questions.forEach((_, i) => {
            const n = document.createElement('div'); n.className = 'node'; n.id = 'node-'+i; n.innerText = i+1;
            n.onclick = () => { move(i - currentIdx); toggleMap(); };
            g.appendChild(n);
        });
    }

    function updateNode(i) { document.getElementById('node-'+i).classList.add(questions[i].ans ? 'node-correct' : 'node-wrong'); }

    function showStreak() {
        const t = document.getElementById('streak-toast'); t.innerText = `🔥 COMBO x${streak}`;
        t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2000);
    }

    function showEndScreen() {
        const p = Math.round((score / questions.length) * 100);
        document.getElementById('final-score').innerText = p + '%';
        document.getElementById('final-rank').innerText = p === 100 ? "🏆 THỦ KHOA RHM" : (p >= 80 ? "🥇 CHUYÊN GIA" : "🥈 CẦN CỐ GẮNG");
        document.getElementById('end-screen').style.display = 'flex';
    }
    function closeEndScreen() { document.getElementById('end-screen').style.display = 'none'; }

    function changeTheme(v) {
        const t = themes[v]; document.documentElement.style.setProperty('--primary', t.p);
        document.getElementById('universe').style.background = t.bg;
        const f = document.getElementById('floating-objects'); f.innerHTML = '';
        for(let i=0; i<10; i++) {
            const e = document.createElement('div'); e.className = 'emoji-floater';
            e.innerText = t.obj[Math.floor(Math.random()*t.obj.length)];
            e.style.left = Math.random()*90+'vw'; e.style.top = Math.random()*90+'vh';
            e.style.animationDuration = (15 + Math.random()*15) + 's';
            f.appendChild(e);
        }
    }

    function playSfx(isC) {
        if(!audioCtx) return; const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination);
        o.frequency.value = isC ? 880 : 200; g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        o.start(); o.stop(audioCtx.currentTime + 0.2);
    }
</script>
</body>
</html>
