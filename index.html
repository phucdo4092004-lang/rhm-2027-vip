<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Sinh Thái RHM 2027 - Phúc VIP</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #00f2fe; 
            --primary-grad: linear-gradient(135deg, #00f2fe, #4facfe); 
            --accent: #ff00de;
            --accent-grad: linear-gradient(135deg, #8b5cf6, #ff00de);
        }
        
        [data-theme="dark"] { 
            --bg-theme: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #020617 80%); 
            --card-bg: rgba(15, 23, 42, 0.6); 
            --text: #f8fafc; 
            --text-muted: #94a3b8;
            --glass: rgba(255,255,255,0.05); 
            --border: rgba(255,255,255,0.1); 
        }
        
        [data-theme="light"] { 
            --bg-theme: radial-gradient(circle at 50% 0%, #e0f2fe 0%, #f8fafc 80%); 
            --card-bg: rgba(255, 255, 255, 0.7); 
            --text: #0f172a; 
            --text-muted: #64748b;
            --glass: rgba(255,255,255,0.5); 
            --border: rgba(0,0,0,0.05); 
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg-theme); color: var(--text); min-height: 100vh; overflow-x: hidden; transition: all 0.5s ease; }

        /* NỀN ĐỘNG (MESH GRADIENT) */
        .mesh-blob { position: absolute; filter: blur(80px); opacity: 0.4; z-index: -1; border-radius: 50%; animation: float 20s infinite alternate ease-in-out; pointer-events: none;}
        .blob-1 { top: -10%; left: -10%; width: 400px; height: 400px; background: #8b5cf6; }
        .blob-2 { bottom: -10%; right: -10%; width: 500px; height: 500px; background: #00f2fe; animation-delay: -5s; }
        @keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(50px, 50px) scale(1.2); } }

        /* HEADER */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 20px 5%; position: relative; z-index: 10; }
        .logo { font-weight: 900; font-size: 20px; letter-spacing: -0.5px; display: flex; align-items: center; gap: 10px; }
        .logo-icon { width: 36px; height: 36px; background: var(--primary-grad); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #000; font-size: 20px; box-shadow: 0 5px 15px rgba(0, 242, 254, 0.4);}
        .btn-theme { background: var(--glass); border: 1px solid var(--border); padding: 10px 20px; border-radius: 50px; color: var(--text); font-weight: 800; cursor: pointer; backdrop-filter: blur(10px); transition: 0.3s; }
        .btn-theme:hover { transform: scale(1.05); border-color: var(--primary); }

        /* MAIN CONTAINER */
        main { max-width: 1100px; margin: 0 auto; padding: 20px; position: relative; z-index: 10; }
        
        .hero-text { text-align: center; margin-bottom: 40px;}
        .badge-exam { display: inline-block; background: rgba(139, 92, 246, 0.15); color: #a78bfa; border: 1px solid rgba(139, 92, 246, 0.3); padding: 6px 16px; border-radius: 50px; font-weight: 800; font-size: 12px; letter-spacing: 1px; margin-bottom: 15px; text-transform: uppercase; }
        .title { font-size: 38px; font-weight: 900; line-height: 1.2; margin-bottom: 10px; letter-spacing: -1px; }
        .title span { background: var(--primary-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* THANH TÌM KIẾM HIỆN ĐẠI */
        .search-box { position: relative; max-width: 600px; margin: 0 auto 40px auto; background: var(--card-bg); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 100px; display: flex; align-items: center; padding: 5px 15px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); transition: 0.3s;}
        .search-box:focus-within { border-color: var(--primary); box-shadow: 0 0 20px rgba(0,242,254,0.3); transform: translateY(-2px); }
        .search-icon { font-size: 20px; margin-right: 10px; }
        .search-input { flex: 1; background: transparent; border: none; padding: 12px 10px; font-size: 15px; color: var(--text); outline: none; font-family: inherit; font-weight: 600; }
        .search-input::placeholder { color: var(--text-muted); }

        /* DONATE BOX */
        .donate-box { background: var(--glass); backdrop-filter: blur(10px); border: 2px dashed var(--accent); border-radius: 20px; padding: 15px; text-align: center; margin-bottom: 40px; cursor: pointer; transition: 0.3s; font-weight: 600; font-size: 14px;}
        .donate-box:hover { transform: scale(1.02); background: rgba(255,0,222,0.1); }

        /* TIÊU ĐỀ MỤC */
        .section-title { font-size: 20px; font-weight: 900; margin-bottom: 20px; display: flex; align-items: center; gap: 10px;}
        .section-title.quiz { color: var(--primary); text-shadow: 0 0 10px rgba(0,242,254,0.4);}
        .section-title.read { color: var(--accent); text-shadow: 0 0 10px rgba(255,0,222,0.4); margin-top: 50px;}

        /* BENTO GRID (THẺ BÀI) */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-bottom: 30px; }
        
        .card { background: var(--card-bg); backdrop-filter: blur(20px); border-radius: 24px; padding: 25px; border: 1px solid var(--border); transition: 0.3s; position: relative; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden;}
        .card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: var(--border); transition: 0.3s; }
        .card.type-quiz::before { background: var(--primary-grad); }
        .card.type-read::before { background: var(--accent-grad); }
        
        .card:hover { transform: translateY(-8px); border-color: var(--glass); box-shadow: 0 20px 40px rgba(0,0,0,0.3); background: var(--glass); }
        
        .card-content { cursor: pointer; flex: 1; }
        .card h3 { margin-top: 0; font-size: 18px; line-height: 1.4; font-weight: 900; margin-bottom: 10px;}
        .card.type-quiz h3 { color: var(--primary); }
        .card.type-read h3 { color: var(--accent); }
        .card p { color: var(--text-muted); font-size: 13px; line-height: 1.6; margin-bottom: 15px; font-weight: 500;}
        
        /* CỤM NÚT BẤM TRONG THẺ */
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        .btn-action { flex: 1; border: none; padding: 12px; border-radius: 12px; font-weight: 800; cursor: pointer; text-transform: uppercase; transition: 0.2s; font-size: 12px; text-align: center; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 5px;}
        .btn-action:hover { filter: brightness(1.2); transform: scale(1.05); }
        
        .btn-main-quiz { background: rgba(0,242,254,0.1); color: var(--primary); border: 1px solid var(--primary); }
        .btn-main-quiz:hover { background: var(--primary-grad); color: #000; }
        
        .btn-flash { background: rgba(245,158,11,0.1); color: #f59e0b; border: 1px solid #f59e0b; }
        .btn-flash:hover { background: #f59e0b; color: #000; }

        .btn-main-read { background: rgba(255,0,222,0.1); color: var(--accent); border: 1px solid var(--accent); }
        .btn-main-read:hover { background: var(--accent-grad); color: #fff; }

        /* LOADING & BADGE */
        .loading { text-align: center; font-weight: 800; color: var(--primary); padding: 20px; font-size: 14px; animation: blink 1s infinite alternate; background: var(--glass); border-radius: 15px; border: 1px dashed var(--primary); width: fit-content; margin: 0 auto;}
        @keyframes blink { 0% { opacity: 0.5; } 100% { opacity: 1; } }
        
        .done-badge { display: inline-block; background: rgba(16,185,129,0.15); color: #10b981; padding: 6px 12px; border-radius: 50px; font-size: 11px; font-weight: 900; margin-top: 5px; border: 1px solid rgba(16,185,129,0.3); letter-spacing: 0.5px;}

        @media (max-width: 768px) {
            .title { font-size: 30px; }
            .header { padding: 15px; }
        }
    </style>
</head>
<body>

  <div class="mesh-blob blob-1"></div>
  <div class="mesh-blob blob-2"></div>

  <header class="header">
    <div class="logo"><div class="logo-icon">🦷</div> TRẠM CHỈ HUY</div>
    <button class="btn-theme" id="theme-toggle" onclick="toggleMode()">🌓 Giao diện</button>
  </header>

  <main>
    <div class="hero-text">
        <div class="badge-exam">🎯 MỤC TIÊU: CCHN 2027</div>
        <h1 class="title">Hệ Sinh Thái RHM<br><span>Bách Chiến Bách Thắng</span></h1>
    </div>

    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" class="search-input" onkeyup="searchApp()" placeholder="Nhập tên đề thi hoặc lý thuyết để tìm nhanh...">
    </div>

    <div class="donate-box" onclick="navigator.clipboard.writeText('8812766209'); alert('Đã copy STK Đỗ Hồng Phúc!');">
      💖 Donate cho phúc đi Đỗ Hồng Phúc <br><b style="color: var(--accent); font-size: 18px;">BIDV 8812766209</b>
    </div>

    <h2 class="section-title quiz">🔥 CHIẾN DỊCH TRẮC NGHIỆM</h2>
    <div id="loader-quiz" class="loading">⏳ Đang tải Ngân Hàng Đề Thi...</div>
    <div class="grid" id="quiz-list"></div>

    <h2 class="section-title read">📚 THƯ VIỆN LÝ THUYẾT</h2>
    <div id="loader-read" class="loading">⏳ Đang tải Tài Liệu Chuyên Ngành...</div>
    <div class="grid" id="read-list"></div>
  </main>

<script>
  // 🔗 SẾP DÁN 2 LINK CSV CỦA SẾP VÀO ĐÂY NHÉ:
  const LINK_SHEET_QUIZ = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRm1d3Z-IwrWF2aFT6yTVAFHN8Hfuehx5EsKdZKC-xyp_zPN7LoHzBImwOf7ohc_qL3HXhcFnGRhVoJ/pub?gid=0&single=true&output=csv";
  const LINK_SHEET_READ = "DÁN_LINK_TAB_TAILIEU_VÀO_ĐÂYhttps://docs.google.com/spreadsheets/d/e/2PACX-1vRBGimZ9-Wucx42mB2y_AiLB7DAMSKngpXiS2D9iuVckZczZDBbsk7PWwKVR6UKcPLCi1yP3hjaCeJF/pub?gid=0&single=true&output=csv";

  // Chuyển đổi giao diện Sáng/Tối
  function toggleMode() { 
      const h = document.documentElement; 
      const isDark = h.getAttribute('data-theme') === 'dark';
      h.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-toggle').innerText = isDark ? '🌘 Chế độ Tối' : '🌓 Chế độ Sáng';
      localStorage.setItem('theme_pref', isDark ? 'light' : 'dark');
  }

  // Khôi phục giao diện đã chọn
  window.onload = () => {
      const savedTheme = localStorage.getItem('theme_pref');
      if(savedTheme) {
          document.documentElement.setAttribute('data-theme', savedTheme);
          document.getElementById('theme-toggle').innerText = savedTheme === 'light' ? '🌘 Chế độ Tối' : '🌓 Chế độ Sáng';
      }
      
      // Gọi hàm tải dữ liệu y như bản gốc của sếp
      fetchData(LINK_SHEET_QUIZ, 'quiz-list', 'Play', 'loader-quiz');
      fetchData(LINK_SHEET_READ, 'read-list', 'Read', 'loader-read');
  };

  // Giữ nguyên thuật toán tìm kiếm
  function searchApp() {
    let filter = document.getElementById('searchInput').value.toUpperCase();
    let cards = document.querySelectorAll('.card');
    cards.forEach(card => {
      let text = card.querySelector('h3').innerText.toUpperCase() + " " + card.querySelector('p').innerText.toUpperCase();
      card.style.display = text.indexOf(filter) > -1 ? "" : "none";
    });
  }

  // Giữ nguyên thuật toán bóc tách CSV xịn của sếp
  function parseCSV(str) {
      const arr = []; let quote = false; let row = 0, col = 0;
      for (let c = 0; c < str.length; c++) {
          let cc = str[c], nc = str[c+1];
          arr[row] = arr[row] || []; arr[row][col] = arr[row][col] || '';
          if (cc == '"' && quote && nc == '"') { arr[row][col] += cc; ++c; continue; }
          if (cc == '"') { quote = !quote; continue; }
          if (cc == ',' && !quote) { ++col; continue; }
          if (cc == '\r' && nc == '\n' && !quote) { ++row; col = 0; ++c; continue; }
          if (cc == '\n' && !quote) { ++row; col = 0; continue; }
          if (cc == '\r' && !quote) { ++row; col = 0; continue; }
          arr[row][col] += cc;
      }
      return arr;
  }

  // Giữ nguyên lõi tải dữ liệu, CHỈ ĐỔI CẤU TRÚC HTML IN RA CHO ĐẸP
  async function fetchData(url, containerId, page, loaderId) {
    const container = document.getElementById(containerId);
    const loader = document.getElementById(loaderId);
    if (url.includes("DÁN_LINK")) { loader.innerHTML = "❌ Sếp chưa dán link CSV vào Code kìa!"; return; }

    try {
      const response = await fetch(url);
      const data = await response.text();
      const rows = parseCSV(data).slice(1);
      loader.style.display = 'none';
      
      rows.forEach(cols => {
        if (cols.length < 4 || !cols[0].trim()) return;
        const id = cols[0].trim(); const title = cols[1].trim(); const desc = cols[2].trim(); const content = cols[3].trim();
        localStorage.setItem(id, content);

        let isDone = localStorage.getItem('done_' + id) === 'true';
        let badgeHTML = isDone ? `<div class="done-badge">✅ ĐÃ MASTER 100%</div>` : '';

        // Tự động điều chỉnh màu nút tùy thuộc vào loại thẻ (Đề thi hay Tài liệu)
        let buttonsHTML = '';
        if(page === 'Play') {
            buttonsHTML = `
                <a href="Play.html?id=${id}&title=${encodeURIComponent(title)}" class="btn-action btn-main-quiz">🚀 THI ẢO</a>
                <a href="Flashcard.html?id=${id}&title=${encodeURIComponent(title)}" class="btn-action btn-flash">🃏 LẬT THẺ</a>
            `;
        } else {
            buttonsHTML = `<a href="Read.html?id=${id}&title=${encodeURIComponent(title)}" class="btn-action btn-main-read">📖 ĐỌC TÀI LIỆU</a>`;
        }

        let typeClass = page === 'Play' ? 'type-quiz' : 'type-read';

        container.innerHTML += `
          <div class="card ${typeClass}">
            <div class="card-content" onclick="location.href='${page}.html?id=${id}&title=${encodeURIComponent(title)}'">
              <h3>${title}</h3>
              <p>${desc}</p>
              ${badgeHTML}
            </div>
            <div class="btn-group">${buttonsHTML}</div>
          </div>
        `;
      });
    } catch (e) { loader.innerHTML = `❌ Lỗi kết nối mạng hoặc link CSV!`; }
  }
</script>
</body>
</html>
