<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ff00de" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Nền App bo góc chuẩn iOS/Android -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="100" fill="none" stroke="url(#neonCyan)" stroke-width="6" stroke-opacity="0.35" />

  <!-- Vòng hào quang công nghệ -->
  <circle cx="256" cy="240" r="155" fill="none" stroke="url(#neonPink)" stroke-width="4" stroke-dasharray="18 12" opacity="0.6" />

  <!-- Biểu tượng Răng cách điệu (Dental Crown & Roots) -->
  <path d="M168 135 C125 135, 105 185, 118 240 C128 285, 148 330, 162 385 C168 408, 195 408, 205 380 C218 340, 232 305, 256 305 C280 305, 294 340, 307 380 C317 408, 344 408, 350 385 C364 330, 384 285, 394 240 C407 185, 387 135, 344 135 C310 135, 285 158, 256 158 C227 158, 202 135, 168 135 Z" fill="url(#neonCyan)" filter="url(#glow)" />

  <!-- Đường nét sáng bóng trên thân răng -->
  <path d="M165 168 C148 180, 142 208, 150 235" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.85" />
  
  <!-- Huy hiệu VIP ở đáy Icon -->
  <rect x="176" y="425" width="160" height="42" rx="21" fill="url(#neonPink)" />
  <text x="256" y="453" font-family="sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">RHM 2027</text>
</svg>
