<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư Viện VIP - Phúc RHM</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #007bff; --primary-grad: linear-gradient(90deg, #007bff, #00c6ff); --accent: #ff00de; }
        [data-theme="dark"] { --bg: #020617; --card: rgba(15, 23, 42, 0.85); --text: #f8fafc; --glass: rgba(255,255,255,0.1); --border: rgba(255,255,255,0.15); }
        [data-theme="light"] { --bg: #f8f9fa; --card: rgba(255, 255, 255, 0.95); --text: #1e293b; --glass: rgba(0,0,0,0.05); --border: rgba(0,0,0,0.1); }
        
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); margin: 0; line-height: 1.8; transition: 0.3s; }
        
        /* HEADER KÍNH MỜ */
        .header { position: sticky; top: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 100; flex-wrap: wrap; gap: 10px; border-bottom: 1px solid var(--border);}
        
        /* NÚT BẤM BO TRÒN (PILL-SHAPE) */
        .btn-tool { 
            background: var(--glass); color: var(--primary); border: 1px solid var(--primary); 
            padding: 8px 20px; border-radius: 50px; cursor: pointer; font-weight: 800; font-size: 13px;
            transition: all 0.3s ease; text-decoration: none; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .btn-tool:hover { background: var(--primary-grad); color: #fff; transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,123,255,0.4); border-color: transparent;}
        .btn-speak { background: linear-gradient(45deg, #ff00de, #ff8a00); color: #fff; border: none; box-shadow: 0 5px 15px rgba(255,0,222,0.4); }
        .btn-speak:hover { box-shadow: 0 8px 25px rgba(255,0,222,0.7); }

        .container { max-width: 850px; margin: 40px auto; padding: 40px; background: var(--card); backdrop-filter: blur(20px); border-radius: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); border: 1px solid var(--border); }
        #content { font-size: 18px; text-align: justify; }
        
        /* MẬT MÃ STYLE */
        .sc-img { display: block; max-width: 100%; border-radius: 20px; margin: 30px auto; border: 3px solid var(--primary); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .sc-red { color: #ff4d4d; font-weight: 800; background: rgba(255,77,77,0.1); padding: 2px 8px; border-radius: 8px;}
        .sc-blue { color: #00c6ff; font-weight: 800; background: rgba(0,198,255,0.1); padding: 2px 8px; border-radius: 8px;}

        /* DONATE KÍNH MỜ */
        .donate-badge { position: fixed; bottom: 20px; right: 20px; background: var(--glass); backdrop-filter: blur(10px); border: 2px dashed #ff00de; padding: 10px 20px; border-radius: 50px; font-size: 13px; font-weight: 800; cursor: pointer; z-index: 1000; box-shadow: 0 0 15px rgba(255,0,222,0.2); transition: 0.3s;}
        .donate-badge:hover { transform: translateY(-5px) scale(1.05); box-shadow: 0 10px 25px rgba(255,0,222,0.5); }
    </style>
</head>
<body>
    <div class="header">
        <a href="index.html" class="btn-tool" style="background:var(--primary-grad); color:#fff; border:none;">⬅ TRỞ VỀ SẢNH</a>
        <div style="display:flex; gap:10px; align-items: center; flex-wrap: wrap;">
            <button class="btn-tool" onclick="adjSize(2)">A+</button>
            <button class="btn-tool" onclick="adjSize(-2)">A-</button>
            <select id="voice-select" class="btn-tool" style="outline: none; appearance: none; text-align:center; padding: 8px 15px; background: rgba(255,255,255,0.1);"></select>
            <button class="btn-tool btn-speak" onclick="speak()">🔊 ĐỌC BÀI</button>
            <button class="btn-tool" onclick="toggleMode()">🌓 CHẾ ĐỘ</button>
        </div>
    </div>
    
    <div class="container">
        <h1 id="title" style="color:var(--primary); border-bottom: 2px dashed var(--accent); padding-bottom: 20px; font-weight: 900; font-size: 32px; text-align: center;">ĐANG TẢI...</h1>
        <div id="content" style="text-align: center; color: gray; margin-top: 50px; font-weight: 700;">Đang kết nối với CSDL Google Sheets của Phúc VIP...</div>
    </div>

    <div class="donate-badge" onclick="copySTK()">💖 Ủng hộ Phúc: <b style="color:var(--accent);">BIDV 8812766209</b></div>

<script>
    let fSize = 18; let synth = window.speechSynthesis;

    function parseSC(txt) {
        return txt.replace(/\[IMG\](.*?)\[\/IMG\]/gi, '<img src="$1" class="sc-img">')
                  .replace(/\[B\](.*?)\[\/B\]/gi, '<b>$1</b>')
                  .replace(/\[RED\](.*?)\[\/RED\]/gi, '<span class="sc-red">$1</span>')
                  .replace(/\[BLUE\](.*?)\[\/BLUE\]/gi, '<span class="sc-blue">$1</span>')
                  .replace(/\[BR\]/gi, '<br><br>');
    }
    
    function adjSize(v) { fSize += v; document.getElementById('content').style.fontSize = fSize + 'px'; }
    function toggleMode() { const h = document.documentElement; h.setAttribute('data-theme', h.getAttribute('data-theme')==='dark'?'light':'dark'); }
    function copySTK() { navigator.clipboard.writeText('8812766209'); alert("Đã copy STK Phúc Đẹp Trai!"); }
    
    function populateVoices() {
        let voices = synth.getVoices().filter(v => v.lang.includes('vi'));
        document.getElementById('voice-select').innerHTML = voices.length ? voices.map((v, i) => `<option value="${i}">${v.name.substring(0,8)}</option>`).join('') : '<option value="">No VN Voice</option>';
    }
    populateVoices(); if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = populateVoices;

    function speak() {
        if (synth.speaking) { synth.cancel(); return; }
        let txtToRead = document.getElementById('content').innerHTML.replace(/<[^>]*>?/gm, '');
        let utter = new SpeechSynthesisUtterance(txtToRead); 
        utter.voice = synth.getVoices().filter(v => v.lang.includes('vi'))[document.getElementById('voice-select').value];
        synth.speak(utter);
    }

    window.onload = function() {
        const id = new URLSearchParams(window.location.search).get('id');
        const title = new URLSearchParams(window.location.search).get('title');

        if(!id) { document.getElementById('content').innerHTML = "Lỗi: Không tìm thấy ID tài liệu."; return; }

        const rawContent = localStorage.getItem(id);
        if(rawContent) {
            document.getElementById('title').innerText = title || "TÀI LIỆU RHM";
            document.getElementById('content').innerHTML = parseSC(rawContent);
        } else {
            document.getElementById('content').innerHTML = "Lỗi kết nối. Hãy quay lại sảnh chính để tải lại Dữ liệu.";
        }
    };
</script>
</body>
</html>
