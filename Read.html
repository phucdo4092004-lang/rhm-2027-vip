<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Thư Viện Lâm Sàng RHM VIP</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/svg+xml" href="./icon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #0ea5e9; --primary-grad: linear-gradient(90deg, #0284c7, #0ea5e9); --accent: #ec4899; }
        [data-theme="dark"] { --bg: #020617; --card: rgba(15, 23, 42, 0.94); --header-bg: rgba(2, 6, 23, 0.88); --text: #f1f5f9; --glass: rgba(255,255,255,0.08); --border: rgba(255,255,255,0.14); }
        [data-theme="light"] { --bg: #f8fafc; --card: #ffffff; --header-bg: rgba(255, 255, 255, 0.92); --text: #1e293b; --glass: rgba(15, 23, 42, 0.05); --border: rgba(15, 23, 42, 0.12); }
        [data-theme="sepia"] { --bg: #f4ecd8; --card: #fdf6e3; --header-bg: rgba(244, 236, 216, 0.94); --text: #433422; --glass: rgba(67, 52, 34, 0.08); --border: rgba(67, 52, 34, 0.15); }
        * { box-sizing: border-box; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); margin: 0; line-height: 1.8; transition: background 0.3s; }
        #reading-progress { position: fixed; top: 0; left: 0; height: 4px; width: 0%; background: linear-gradient(90deg, #00f2fe, #ff00de); z-index: 2000; }
        .header { position: sticky; top: 0; background: var(--header-bg); backdrop-filter: blur(20px); padding: 10px 18px; display: flex; justify-content: space-between; align-items: center; gap: 10px; z-index: 100; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
        .in-doc-search { flex: 1; max-width: 300px; background: var(--glass); border: 1px solid var(--border); border-radius: 50px; padding: 7px 14px; color: var(--text); font-family: inherit; font-size: 13px; outline: none; }
        .btn-bar { background: var(--glass); color: var(--text); border: 1px solid var(--border); padding: 7px 13px; border-radius: 50px; font-weight: 800; font-size: 12px; cursor: pointer; text-decoration: none; font-family: inherit; }
        .container { max-width: 860px; margin: 28px auto 80px auto; padding: 36px 32px; background: var(--card); border-radius: 26px; box-shadow: 0 15px 40px rgba(0,0,0,0.2); border: 1px solid var(--border); }
        #content { font-family: 'Lora', serif; font-size: 18.5px; line-height: 1.85; white-space: pre-wrap; color: var(--text); margin-top: 20px; }
        mark.hl { background: #facc15; color: #000; padding: 1px 4px; border-radius: 4px; font-weight: 700; }
        .sc-img { display: block; max-width: 100%; border-radius: 12px; margin: 20px auto; border: 2px solid var(--primary); }
        .sc-red { color: #ef4444; font-weight: 700; background: rgba(239,68,68,0.12); padding: 2px 8px; border-radius: 6px; }
        .sc-blue { color: #0ea5e9; font-weight: 700; background: rgba(14,165,233,0.12); padding: 2px 8px; border-radius: 6px; }
        #ai-selection-btn { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); background: linear-gradient(45deg, #8b5cf6, #ec4899); color: #fff; border: none; padding: 11px 22px; border-radius: 50px; font-weight: 900; font-size: 13px; cursor: pointer; z-index: 1500; display: none; box-shadow: 0 10px 25px rgba(236,72,153,0.4); }
    </style>
</head>
<body>
    <div id="reading-progress"></div>
    <button id="ai-selection-btn" onclick="askGeminiSelection()">🤖 Giải thích đoạn bôi đen với Gemini</button>

    <div class="header">
        <a href="index.html" class="btn-bar" style="background:var(--primary-grad); color:#fff; border:none;">⬅ SẢNH</a>
        <input type="text" id="docSearch" class="in-doc-search" oninput="highlightText()" placeholder="🔍 Tìm kiếm từ khóa trong bài...">
        <div style="display:flex; gap:6px;">
            <button class="btn-bar" onclick="adjSize(2)">A+</button>
            <button class="btn-bar" onclick="adjSize(-2)">A-</button>
            <button class="btn-bar" onclick="setTheme('dark')">🌘</button>
            <button class="btn-bar" onclick="setTheme('light')">☀️</button>
            <button class="btn-bar" onclick="setTheme('sepia')" style="background:#f4ecd8; color:#433422;">📜 Sepia</button>
        </div>
    </div>

    <div class="container">
        <h1 id="title" style="color:var(--primary); border-bottom:2px dashed var(--accent); padding-bottom:15px; font-weight:900; font-size:24px; text-align:center; margin-top:0;">ĐANG TẢI...</h1>
        <div id="content">Đang kết nối CSDL...</div>
    </div>

<script>
    let fSize = 18.5, originalHTML = "", selectedText = "";
    window.onscroll = () => {
        const st = document.documentElement.scrollTop || document.body.scrollTop;
        const sh = document.documentElement.scrollHeight - document.documentElement.clientHeight;
        document.getElementById('reading-progress').style.width = (sh > 0 ? (st / sh) * 100 : 0) + '%';
    };
    document.addEventListener('selectionchange', () => {
        const s = window.getSelection().toString().trim();
        const btn = document.getElementById('ai-selection-btn');
        if (s.length > 5) { selectedText = s; btn.style.display = 'block'; } else { btn.style.display = 'none'; }
    });
    function askGeminiSelection() {
        navigator.clipboard.writeText(`Chào Gemini, tôi là sinh viên Răng Hàm Mặt. Hãy giải thích cơ chế lâm sàng dễ nhớ cho đoạn kiến thức sau:\n\n"${selectedText}"`).then(() => window.open('https://gemini.google.com/', '_blank'));
    }
    function highlightText() {
        const kw = document.getElementById('docSearch').value.trim();
        const c = document.getElementById('content');
        if (!kw) { c.innerHTML = originalHTML; return; }
        const safe = kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        c.innerHTML = originalHTML.replace(new RegExp(`(${safe})(?![^<]*>)`, 'gi'), '<mark class="hl">$1</mark>');
    }
    function setTheme(t) { document.documentElement.setAttribute('data-theme', t); if (t !== 'sepia') localStorage.setItem('theme_pref', t); }
    function adjSize(v) { fSize = Math.max(14, Math.min(30, fSize + v)); document.getElementById('content').style.fontSize = fSize + 'px'; }
    function parseSC(txt) { return txt.replace(/\[IMG\](.*?)\[\/IMG\]/gi, '<img src="$1" class="sc-img">').replace(/\[B\](.*?)\[\/B\]/gi, '<b>$1</b>').replace(/\[RED\](.*?)\[\/RED\]/gi, '<span class="sc-red">$1</span>').replace(/\[BLUE\](.*?)\[\/BLUE\]/gi, '<span class="sc-blue">$1</span>').replace(/\[BR\]/gi, '<br>'); }

    window.onload = () => {
        document.documentElement.setAttribute('data-theme', localStorage.getItem('theme_pref') || 'dark');
        const id = new URLSearchParams(window.location.search).get('id');
        const title = new URLSearchParams(window.location.search).get('title');
        const raw = localStorage.getItem(id);
        if (raw) {
            document.getElementById('title').innerText = title || "TÀI LIỆU RHM";
            originalHTML = parseSC(raw);
            document.getElementById('content').innerHTML = originalHTML;
        }
    };
</script>
</body>
</html>
